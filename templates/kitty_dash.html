<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kitty Dash</title>
<style>
  :root {
    --bg-gradient-start: #0a0a1a;
    --bg-gradient-mid: #1a0a2e;
    --bg-gradient-end: #0a0a1a;
    --border-color: #05d9e8;
    --shadow-color: rgba(5,217,232,0.3);
    --inset-shadow: rgba(255,42,109,0.1);
    --score-color: #05d9e8;
    --score-shadow: #05d9e8;
    --speed-color: #ff2a6d;
    --speed-shadow: #ff2a6d;
    --title-gradient-start: #ff2a6d;
    --title-gradient-mid: #05d9e8;
    --title-gradient-end: #d300c5;
    --subtitle-color: #8899aa;
    --btn-border: #05d9e8;
    --btn-color: #05d9e8;
    --btn-hover-bg: #05d9e8;
    --btn-hover-color: #000;
    --btn-shadow: rgba(5,217,232,0.2);
    --btn-hover-shadow: rgba(5,217,232,0.6);
    --final-score-color: #ff2a6d;
    --final-score-shadow: #ff2a6d;
    --high-score-color: #8899aa;
    --controls-color: #556677;
    --controls-span-border: #334455;
    --controls-span-color: #8899aa;
    --speed-bar-bg: rgba(255,255,255,0.1);
    --speed-bar-gradient-start: #05d9e8;
    --speed-bar-gradient-end: #ff2a6d;
    --speed-bar-shadow: #ff2a6d;
    --speed-label-color: #556677;
    --screen-bg: rgba(10,10,26,0.92);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    touch-action: none;
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1200px;
    max-height: 600px;
    background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
    overflow: hidden;
    border: 2px solid var(--border-color);
    box-shadow: 0 0 30px var(--shadow-color), inset 0 0 60px var(--inset-shadow);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  #score {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 28px;
    font-weight: 900;
    color: var(--score-color);
    text-shadow: 0 0 10px var(--score-shadow), 0 0 20px var(--score-shadow);
    letter-spacing: 2px;
  }
  #speed-indicator {
    position: absolute;
    top: 20px;
    left: 30px;
    font-size: 18px;
    font-weight: 700;
    color: var(--speed-color);
    text-shadow: 0 0 8px var(--speed-shadow);
  }
  #start-screen, #game-over-screen, #pause-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--screen-bg);
    backdrop-filter: blur(8px);
    pointer-events: all;
    z-index: 20;
    transition: opacity 0.4s;
  }
  #game-over-screen { opacity: 0; pointer-events: none; }
  #game-over-screen.active { opacity: 1; pointer-events: all; }
  #pause-screen { opacity: 0; pointer-events: none; }
  #pause-screen.active { opacity: 1; pointer-events: all; }
  h1 {
    font-size: 64px;
    background: linear-gradient(90deg, var(--title-gradient-start), var(--title-gradient-mid), var(--title-gradient-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 15px rgba(255,42,109,0.5));
    margin-bottom: 10px;
    animation: titlePulse 2s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%,100% { filter: drop-shadow(0 0 15px rgba(255,42,109,0.5)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 30px rgba(5,217,232,0.8)); transform: scale(1.03); }
  }
  .subtitle {
    color: var(--subtitle-color);
    font-size: 16px;
    margin-bottom: 40px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .btn {
    padding: 16px 48px;
    font-size: 22px;
    font-weight: 800;
    border: 2px solid var(--btn-border);
    background: transparent;
    color: var(--btn-color);
    cursor: pointer;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 3px;
    transition: all 0.2s;
    box-shadow: 0 0 15px var(--btn-shadow);
    pointer-events: all;
  }
  .btn:hover {
    background: var(--btn-hover-bg);
    color: var(--btn-hover-color);
    box-shadow: 0 0 30px var(--btn-hover-shadow);
    transform: translateY(-2px);
  }
  .final-score {
    font-size: 48px;
    color: var(--final-score-color);
    text-shadow: 0 0 20px var(--final-score-shadow);
    margin: 20px 0;
  }
  .kitty-reward-line {
    font-size: 18px;
    font-weight: 700;
    color: #ffd15a;
    margin: -12px 0 16px;
  }
  .high-score {
    font-size: 18px;
    color: var(--high-score-color);
    margin-bottom: 30px;
  }
  .controls-hint {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    color: var(--controls-color);
    font-size: 14px;
    letter-spacing: 1px;
  }
  .controls-hint span {
    display: inline-block;
    padding: 4px 10px;
    border: 1px solid var(--controls-span-border);
    border-radius: 4px;
    margin: 0 4px;
    color: var(--controls-span-color);
  }
  #speed-bar-container {
    position: absolute;
    bottom: 20px;
    right: 30px;
    width: 150px;
    height: 6px;
    background: var(--speed-bar-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  #speed-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--speed-bar-gradient-start), var(--speed-bar-gradient-end));
    border-radius: 3px;
    transition: width 0.3s;
    box-shadow: 0 0 10px var(--speed-bar-shadow);
  }
  #speed-label {
    position: absolute;
    bottom: 30px;
    right: 30px;
    font-size: 10px;
    color: var(--speed-label-color);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Theme Switcher Styles - IMPROVED */
  #theme-switcher {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.7);
    padding: 10px 18px;
    border-radius: 40px;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .theme-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .theme-btn:hover {
    transform: scale(1.2) translateY(-2px);
    border-color: rgba(255,255,255,0.6);
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .theme-btn.active {
    border-color: #fff;
    box-shadow: 0 0 16px rgba(255,255,255,0.5), 0 0 32px rgba(255,255,255,0.2);
    transform: scale(1.15);
  }
  .theme-btn::after {
    content: attr(data-label);
    position: absolute;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #fff;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .theme-btn:hover::after,
  .theme-btn.active::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .theme-neon { background: linear-gradient(135deg, #ff2a6d 0%, #05d9e8 50%, #d300c5 100%); }
  .theme-volcano { background: linear-gradient(135deg, #ff4500 0%, #ff8c00 40%, #8b0000 100%); }
  .theme-forest { background: linear-gradient(135deg, #00ff88 0%, #228b22 50%, #006400 100%); }
  .theme-ocean { background: linear-gradient(135deg, #00bfff 0%, #1e90ff 50%, #00008b 100%); }
  .theme-cyber { background: linear-gradient(135deg, #d300c5 0%, #7a40ff 50%, #05d9e8 100%); }

  /* Pause hint */
  #pause-hint {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #pause-hint.hidden { opacity: 0; }
</style>
</head>

<div id="theme-switcher">

  <div class="theme-btn theme-forest" data-theme="forest" data-label="Forest" title="Mystic Forest"></div>
  <div class="theme-btn theme-ocean" data-theme="ocean" data-label="Ocean" title="Deep Ocean"></div>
  <div class="theme-btn theme-cyber" data-theme="cyber" data-label="Cyber" title="Cyber Grid"></div>
</div>

<div id="pause-hint">Press P to Pause</div>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div id="score">0</div>
    <div id="speed-indicator">SPEED: 1.0x</div>
    <div id="speed-label">Velocity</div>
    <div id="speed-bar-container"><div id="speed-bar"></div></div>

</div>

  <div id="start-screen">
    <h1>KITTY DASH</h1>
    <div class="subtitle" id="startSubtitle">Neon Runner</div>
    <button class="btn" id="startBtn">START RUN</button>
    <div class="controls-hint">
      <span>SPACE</span> or <span>UP</span> or <span>TAP</span> to Jump &nbsp;|&nbsp; <span>DOWN</span> to Duck &nbsp;|&nbsp; <span>P</span> to Pause
    </div>
  </div>

  <div id="game-over-screen">
    <h1>CRASHED!</h1>
    <div class="final-score" id="finalScore">0</div>
    <div class="high-score" id="highScore">Best: 0</div>
    <button class="btn" id="restartBtn">RUN AGAIN</button>
    <div class="controls-hint">
      <span>SPACE</span> or <span>TAP</span> to Restart &nbsp;|&nbsp; <span>P</span> to Pause
    </div>
  </div>

  <div id="pause-screen">
    <h1>PAUSED</h1>
    <div class="subtitle" id="pauseSubtitle">Neon Runner</div>
    <div class="final-score" id="pauseScore">0</div>
    <button class="btn" id="resumeBtn">RESUME</button>
    <div class="controls-hint">
      <span>P</span> or <span>ESC</span> or <span>CLICK</span> to Resume
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/zoro_rewards.js') }}"></script>

function T(key) {
  var theme = themes[currentTheme];
  if (theme && theme[key] !== undefined) return theme[key];
  return themes['neon'][key];
}

function setTheme(themeName) {
  if (!themes[themeName]) return;
  initAudio();
  sfxThemeSwitch();
  currentTheme = themeName;
  var cssVars = themes[themeName].css;
  for (var key in cssVars) {
    document.documentElement.style.setProperty(key, cssVars[key]);
  }
  var name = themes[themeName].name;
  if (startSubtitle) startSubtitle.textContent = name;
  if (pauseSubtitle) pauseSubtitle.textContent = name;
  var btns = document.querySelectorAll('.theme-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].dataset.theme === currentTheme);
  }
  initThemeBgElements();
  initStars();
  initBgLayers();
  initNebulae();
  initMoon();
}

function initThemeBgElements() {
  var bgType = T('bgType');
  embers = []; bubbles = []; fireflies = []; gridLines = [];
  if (bgType === 'volcano') initEmbers();
  else if (bgType === 'ocean') initBubbles();
  else if (bgType === 'forest') initFireflies();
  else if (bgType === 'cyber') initGridLines();
}

// ============================================
// AUDIO SYSTEM (Web Audio API - Self-Contained)
// ============================================

var audioCtx = null;
var bgmOscillators = [];
var bgmGain = null;
var bgmFilter = null;
var isBgmPlaying = false;
var bgmInterval = null;
var masterGain = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.35;
    masterGain.connect(audioCtx.destination);
  } catch(e) {
    console.log('Web Audio not supported');
  }
}

// Soft pleasant ambient background music
function startBGM() {
  if (!audioCtx || isBgmPlaying) return;
  initAudio();
  isBgmPlaying = true;

  // Create a lush ambient pad using multiple oscillators
  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = 0;
  bgmGain.connect(masterGain);

  bgmFilter = audioCtx.createBiquadFilter();
  bgmFilter.type = 'lowpass';
  bgmFilter.frequency.value = 800;
  bgmFilter.Q.value = 1;
  bgmFilter.connect(bgmGain);

  // Ambient chord progression
  var chords = [
    [261.63, 329.63, 392.00], // C major
    [220.00, 277.18, 329.63], // A minor
    [174.61, 220.00, 261.63], // F major
    [196.00, 246.94, 293.66]  // G major
  ];
  var chordIdx = 0;

  function playChord() {
    if (!isBgmPlaying) return;
    // Fade out old oscillators
    bgmOscillators.forEach(function(osc) {
      var g = osc.gain;
      g.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
      setTimeout(function() { try { osc.stop(); } catch(e) {} }, 600);
    });
    bgmOscillators = [];

    var chord = chords[chordIdx];
    chordIdx = (chordIdx + 1) % chords.length;

    chord.forEach(function(freq) {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      g.gain.value = 0;
      g.gain.setTargetAtTime(0.08, audioCtx.currentTime, 1.0);
      osc.connect(g);
      g.connect(bgmFilter);
      osc.start();
      bgmOscillators.push({ stop: function() { osc.stop(); }, gain: g });
    });
  }

  playChord();
  bgmInterval = setInterval(playChord, 4000);

  // Gentle filter sweep
  function sweepFilter() {
    if (!isBgmPlaying) return;
    var now = audioCtx.currentTime;
    bgmFilter.frequency.setValueAtTime(600, now);
    bgmFilter.frequency.linearRampToValueAtTime(1200, now + 2);
    bgmFilter.frequency.linearRampToValueAtTime(600, now + 4);
    setTimeout(sweepFilter, 4000);
  }
  sweepFilter();

  // Fade in overall
  bgmGain.gain.setTargetAtTime(1, audioCtx.currentTime, 2);
}

function stopBGM() {
  isBgmPlaying = false;
  if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  if (bgmGain) {
    bgmGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
    setTimeout(function() {
      bgmOscillators.forEach(function(osc) { try { osc.stop(); } catch(e) {} });
      bgmOscillators = [];
    }, 600);
  }
}

// Sound effect: Jump (soft bubbly pop)
function sfxJump() {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  var f = audioCtx.createBiquadFilter();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(350, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.12);
  g.gain.setValueAtTime(0.2, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
  f.type = 'lowpass';
  f.frequency.value = 2000;
  osc.connect(f);
  f.connect(g);
  g.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}

// Sound effect: Duck (soft whoosh)
function sfxDuck() {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  var f = audioCtx.createBiquadFilter();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
  g.gain.setValueAtTime(0.1, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  f.type = 'lowpass';
  f.frequency.value = 800;
  osc.connect(f);
  f.connect(g);
  g.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.16);
}

// Sound effect: Crash / Game Over (soft descending tone)
function sfxCrash() {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.6);
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
  osc.connect(g);
  g.connect(masterGain);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.65);

  // Add a soft noise burst
  var bufferSize = audioCtx.sampleRate * 0.3;
  var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  var data = buffer.getChannelData(0);
  for (var i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
  }
  var noise = audioCtx.createBufferSource();
  var ng = audioCtx.createGain();
  noise.buffer = buffer;
  ng.gain.value = 0.08;
  noise.connect(ng);
  ng.connect(masterGain);
  noise.start();
}

function initStars() {
  stars = [];
  var count = T('bgType') === 'ocean' ? 80 : 150;
  for (var i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.7,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.5 + 0.1,
      brightness: Math.random(),

// ============================================
// KITTY TRAIL
// ============================================

function updateTrail() {
  kitty.trail.push({ x: kitty.x, y: kitty.y + kitty.height/2, alpha: 0.6 });
  if (kitty.trail.length > 12) kitty.trail.shift();
  for (var i = 0; i < kitty.trail.length; i++) {
    kitty.trail[i].alpha -= 0.05;
  }
}

// ============================================
// DRAW KITTY
// ============================================

function drawKitty() {
  var k = kitty;
  var centerX = k.x + k.width/2;
  var centerY = k.y + k.height/2;

  // Neon trail
  for (var i = 0; i < kitty.trail.length; i++) {
    var t = kitty.trail[i];
    if (t.alpha <= 0) continue;
    ctx.beginPath();
    ctx.arc(t.x + k.width/2, t.y, 6 - i*0.4, 0, Math.PI*2);
    ctx.fillStyle = T('trailColor') + (t.alpha * 0.4) + ')';
    ctx.fill();
  }

  // Glow
  ctx.shadowBlur = 20;
  ctx.shadowColor = T('kittyGlow');

  // Body
  ctx.fillStyle = T('kittyBody');
  ctx.beginPath();
  ctx.ellipse(centerX, centerY, k.width/2, k.height/2, 0, 0, Math.PI*2);
  ctx.fill();

  // Body highlight
  ctx.fillStyle = T('kittyHighlight');
  ctx.beginPath();
  ctx.ellipse(centerX - 5, centerY - 5, k.width/3, k.height/3, -0.3, 0, Math.PI*2);
  ctx.fill();

  // Ears
  var earH = 14;
  var earOffset = k.ducking ? 6 : 0;
  ctx.fillStyle = T('kittyEar');
  // Left ear
  ctx.beginPath();
  ctx.moveTo(centerX - 12, k.y + 6 + earOffset);
  ctx.lineTo(centerX - 18, k.y - earH + earOffset);
  ctx.lineTo(centerX - 4, k.y + 2 + earOffset);
  ctx.fill();
  // Right ear
  ctx.beginPath();
  ctx.moveTo(centerX + 12, k.y + 6 + earOffset);
  ctx.lineTo(centerX + 18, k.y - earH + earOffset);
  ctx.lineTo(centerX + 4, k.y + 2 + earOffset);
  ctx.fill();

  // Inner ears
  ctx.fillStyle = T('kittyInnerEar');
  ctx.beginPath();
  ctx.moveTo(centerX - 12, k.y + 6 + earOffset);
  ctx.lineTo(centerX - 16, k.y - earH + 6 + earOffset);
  ctx.lineTo(centerX - 6, k.y + 3 + earOffset);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(centerX + 12, k.y + 6 + earOffset);
  ctx.lineTo(centerX + 16, k.y - earH + 6 + earOffset);
  ctx.lineTo(centerX + 6, k.y + 3 + earOffset);
  ctx.fill();

  // Eyes
  k.blinkTimer++;
  var blink = k.blinkTimer > 180 && k.blinkTimer < 190;
  ctx.shadowBlur = 10;
  ctx.shadowColor = T('kittyEye');
  ctx.fillStyle = T('kittyEye');
  if (!blink) {
    ctx.beginPath();
    ctx.ellipse(centerX - 8, centerY - 4, 5, 6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(centerX + 8, centerY - 4, 5, 6, 0, 0, Math.PI*2);
    ctx.fill();
    // Pupils
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(centerX - 7, centerY - 4, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(centerX + 9, centerY - 4, 2.5, 0, Math.PI*2);
    ctx.fill();
    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(centerX - 9, centerY - 6, 1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(centerX + 7, centerY - 6, 1.5, 0, Math.PI*2);
    ctx.fill();
  } else {
    ctx.strokeStyle = T('kittyEye');
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(centerX - 12, centerY - 4);
    ctx.lineTo(centerX - 4, centerY - 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(centerX + 4, centerY - 4);
    ctx.lineTo(centerX + 12, centerY - 4);
    ctx.stroke();
  }
  if (k.blinkTimer > 200) k.blinkTimer = 0;

  // Nose
  ctx.shadowBlur = 5;
  ctx.shadowColor = T('kittyNose');
  ctx.fillStyle = T('kittyNose');
  ctx.beginPath();
  ctx.moveTo(centerX, centerY + 2);
  ctx.lineTo(centerX - 4, centerY + 6);
  ctx.lineTo(centerX + 4, centerY + 6);
  ctx.fill();

  // Mouth
  ctx.strokeStyle = T('kittyMouth');
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(centerX - 3, centerY + 6, 3, 0, Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(centerX + 3, centerY + 6, 3, 0, Math.PI);
  ctx.stroke();

  // Whiskers
  ctx.shadowBlur = 0;
  ctx.strokeStyle = T('kittyWhisker');
  ctx.lineWidth = 1;
  var wy = centerY + 4;
  ctx.beginPath();
  ctx.moveTo(centerX - 18, wy - 2); ctx.lineTo(centerX - 30, wy - 4);
  ctx.moveTo(centerX - 18, wy + 2); ctx.lineTo(centerX - 30, wy + 4);
  ctx.moveTo(centerX + 18, wy - 2); ctx.lineTo(centerX + 30, wy - 4);
  ctx.moveTo(centerX + 18, wy + 2); ctx.lineTo(centerX + 30, wy + 4);
  ctx.stroke();

  // Tail
  ctx.shadowBlur = 10;
  ctx.shadowColor = T('kittyTail');
  ctx.strokeStyle = T('kittyTail');
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  var tailBaseX = k.x + 5;
  var tailBaseY = centerY + 5;
  var tailWag = Math.sin(frameCount * 0.15) * 10;
  ctx.beginPath();
  ctx.moveTo(tailBaseX, tailBaseY);
  ctx.quadraticCurveTo(tailBaseX - 15, tailBaseY - 15 + tailWag, tailBaseX - 25, tailBaseY - 5 + tailWag * 0.5);
  ctx.stroke();
  // Tail tip
  ctx.fillStyle = T('kittyTailTip');
  ctx.beginPath();
  ctx.arc(tailBaseX - 25, tailBaseY - 5 + tailWag * 0.5, 4, 0, Math.PI*2);
  ctx.fill();

  // Legs (running animation)
  ctx.shadowBlur = 5;
  ctx.strokeStyle = T('kittyLeg');
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  var legOffset = k.grounded ? Math.sin(frameCount * 0.4) * 8 : 0;
  var legY = k.y + k.height - 3;
  // Back legs
  ctx.beginPath();
  ctx.moveTo(centerX - 10, legY - 5);
  ctx.lineTo(centerX - 12 - legOffset, legY + 5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(centerX + 5, legY - 5);
  ctx.lineTo(centerX + 3 + legOffset, legY + 5);
  ctx.stroke();

  ctx.shadowBlur = 0;
}

// ============================================
// DRAW OBSTACLE
// ============================================

function drawObstacle(obs) {
  ctx.shadowBlur = 15;
  var glow = Math.sin(frameCount * 0.05 + obs.glowPhase) * 0.3 + 0.7;

  switch(obs.type) {
    case 'cactus':
      ctx.shadowColor = T('cactusGlow');
      ctx.fillStyle = T('cactusColor') + glow + ')';
      // Main stem
      ctx.fillRect(obs.x + obs.width*0.35, obs.y, obs.width*0.3, obs.height);
      // Left arm
      ctx.fillRect(obs.x, obs.y + obs.height*0.3, obs.width*0.4, obs.height*0.15);
      ctx.fillRect(obs.x, obs.y + obs.height*0.15, obs.width*0.15, obs.height*0.2);
      // Right arm
      ctx.fillRect(obs.x + obs.width*0.6, obs.y + obs.height*0.4, obs.width*0.4, obs.height*0.15);
      ctx.fillRect(obs.x + obs.width*0.85, obs.y + obs.height*0.25, obs.width*0.15, obs.height*0.2);
      // Spikes
      ctx.fillStyle = T('cactusSpike');
      for (var i = 0; i < 5; i++) {
        var sy = obs.y + 5 + i * (obs.height/5);
        ctx.beginPath();
        ctx.moveTo(obs.x + obs.width*0.35, sy);
        ctx.lineTo(obs.x + obs.width*0.35 - 4, sy - 3);
        ctx.lineTo(obs.x + obs.width*0.35, sy + 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(obs.x + obs.width*0.65, sy + 5);
        ctx.lineTo(obs.x + obs.width*0.65 + 4, sy + 2);
        ctx.lineTo(obs.x + obs.width*0.65, sy + 7);
        ctx.fill();
      }
      break;

    case 'spike':
      ctx.shadowColor = T('spikeGlow');
      ctx.fillStyle = T('spikeColor') + glow + ')';
      ctx.beginPath();
      ctx.moveTo(obs.x, obs.y + obs.height);
      ctx.lineTo(obs.x + obs.width/2, obs.y);
      ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
      ctx.closePath();
      ctx.fill();
      // Inner glow
      ctx.fillStyle = T('spikeInner') + (glow*0.5) + ')';
      ctx.beginPath();
      ctx.moveTo(obs.x + 8, obs.y + obs.height);
      ctx.lineTo(obs.x + obs.width/2, obs.y + 10);
      ctx.lineTo(obs.x + obs.width - 8, obs.y + obs.height);
      ctx.closePath();
      ctx.fill();
      break;

    case 'block':
      ctx.shadowColor = T('blockGlow');
      ctx.fillStyle = T('blockColor') + glow + ')';
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      // Border
      ctx.strokeStyle = T('blockBorder');
      ctx.lineWidth = 2;
      ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
      // Inner pattern
      ctx.fillStyle = T('blockInner') + (glow*0.4) + ')';
      ctx.fillRect(obs.x + 8, obs.y + 8, obs.width - 16, obs.height - 16);
      // X pattern
      ctx.strokeStyle = T('blockX') + (glow*0.8) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(obs.x + 8, obs.y + 8);
      ctx.lineTo(obs.x + obs.width - 8, obs.y + obs.height - 8);
      ctx.moveTo(obs.x + obs.width - 8, obs.y + 8);
      ctx.lineTo(obs.x + 8, obs.y + obs.height - 8);
      ctx.stroke();
      break;

    case 'flying':
      var floatY = Math.sin(frameCount * 0.08 + obs.floatOffset) * 8;
      var fy = obs.y + floatY;
      ctx.shadowColor = T('flyingGlow');
      ctx.fillStyle = T('flyingColor') + glow + ')';
      // Drone body
      ctx.beginPath();
      ctx.ellipse(obs.x + obs.width/2, fy + obs.height/2, obs.width/2, obs.height/3, 0, 0, Math.PI*2);
      ctx.fill();
      // Propellers
      ctx.fillStyle = T('flyingProp') + glow + ')';
      var propSpin = frameCount * 0.5;
      ctx.save();
      ctx.translate(obs.x + 5, fy + 5);
      ctx.rotate(propSpin);
      ctx.fillRect(-8, -2, 16, 4);
      ctx.fillRect(-2, -8, 4, 16);
      ctx.restore();
      ctx.save();
      ctx.translate(obs.x + obs.width - 5, fy + 5);
      ctx.rotate(propSpin);
      ctx.fillRect(-8, -2, 16, 4);
      ctx.fillRect(-2, -8, 4, 16);
      ctx.restore();
      // Eye
      ctx.fillStyle = T('flyingEye');
      ctx.beginPath();
      ctx.arc(obs.x + obs.width/2, fy + obs.height/2, 4, 0, Math.PI*2);
      ctx.fill();
      break;

    case 'laser':
      obs.blinkTimer++;
      var laserOn = obs.blinkTimer % 120 < 80;
      if (laserOn) {
        ctx.shadowColor = T('laserGlow');
        ctx.shadowBlur = 25;
        ctx.fillStyle = T('laserColor') + (0.6 + Math.sin(frameCount*0.2)*0.3) + ')';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        ctx.fillStyle = T('laserBeam');
        ctx.fillRect(obs.x + 5, obs.y, 4, obs.height);
        ctx.fillRect(obs.x + obs.width - 9, obs.y, 4, obs.height);
      }
      // Warning indicator
      ctx.shadowBlur = 10;
      ctx.shadowColor = T('laserGlow');
      ctx.fillStyle = obs.blinkTimer % 30 < 15 ? T('laserWarnOn') : T('laserWarnOff');
      ctx.beginPath();
      ctx.arc(obs.x + obs.width/2, obs.y - 10, 4, 0, Math.PI*2);
      ctx.fill();
      break;
  }
  ctx.shadowBlur = 0;
}

// ============================================
// DRAW MOON
// ============================================

function drawMoon() {
  ctx.save();
  ctx.shadowBlur = 35;
  ctx.shadowColor = T('moonShadow');
  var grad = ctx.createRadialGradient(moon.x - moon.r*0.3, moon.y - moon.r*0.3, moon.r*0.1, moon.x, moon.y, moon.r);
  grad.addColorStop(0, T('moonGradStart'));
  grad.addColorStop(0.6, T('moonGradMid'));
  grad.addColorStop(1, T('moonGradEnd'));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI*2);
  ctx.fill();

  // Craters
  ctx.shadowBlur = 0;
  ctx.fillStyle = T('moonCrater');
  ctx.beginPath(); ctx.arc(moon.x - moon.r*0.3, moon.y - moon.r*0.2, moon.r*0.18, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(moon.x + moon.r*0.25, moon.y + moon.r*0.3, moon.r*0.12, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(moon.x + moon.r*0.1, moon.y - moon.r*0.35, moon.r*0.09, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ============================================
// DRAW NEBULA CLOUDS
// ============================================

function drawNebulae() {
  for (var i = 0; i < nebulae.length; i++) {
    var n = nebulae[i];
    n.x -= n.speed * speedMultiplier;
    if (n.x < -n.r) {
      n.x = canvas.width + n.r;
      n.y = Math.random() * canvas.height * 0.55;
    }
    var pulse = Math.sin(frameCount * 0.008 + n.phase) * 0.3 + 0.7;
    var grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    grad.addColorStop(0, n.color + (n.alpha * pulse) + ')');
    grad.addColorStop(1, n.color + '0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fill();
  }
}

// ============================================
// DRAW SHOOTING STARS
// ============================================

function drawShootingStars() {
  if (Math.random() < 0.004) {
    shootingStars.push({
      x: canvas.width * (0.2 + Math.random() * 0.6),
      y: canvas.height * Math.random() * 0.3,
      len: 70 + Math.random() * 70,
      speed: 9 + Math.random() * 7,
      angle: 0.45 + Math.random() * 0.35,
      life: 1
    });
  }
  for (var i = shootingStars.length - 1; i >= 0; i--) {
    var s = shootingStars[i];
    s.x -= Math.cos(s.angle) * s.speed;
    s.y += Math.sin(s.angle) * s.speed;
    s.life -= 0.025;
    if (s.life <= 0) {
      shootingStars.splice(i, 1);
      continue;
    }
    var tailX = s.x + Math.cos(s.angle) * s.len;
    var tailY = s.y - Math.sin(s.angle) * s.len;
    var sgrad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
    sgrad.addColorStop(0, 'rgba(255,255,255,' + s.life + ')');
    sgrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = sgrad;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();
  }
}

// ============================================
// DRAW BACKGROUND
// ============================================

// ============================================
// THEME-SPECIFIC BACKGROUND DRAWERS
// ============================================

function drawVolcanoBg() {
  // Volcanic smoke/ash particles
  for (var i = 0; i < embers.length; i++) {
    var e = embers[i];
    e.y -= e.speed * speedMultiplier * 0.5;
    e.x += Math.sin(frameCount * 0.02 + e.wobble) * 0.5;
    e.life -= 0.005;
    if (e.y < -10 || e.life <= 0) {
      e.y = canvas.height + 10;
      e.x = Math.random() * canvas.width;
      e.life = 1;
    }
    ctx.globalAlpha = e.life * 0.6;
    ctx.fillStyle = '#ff4500';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#ff4500';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Lava glow at bottom
  var lavaGrad = ctx.createLinearGradient(0, canvas.height - 100, 0, canvas.height);
  lavaGrad.addColorStop(0, 'rgba(255,69,0,0)');
  lavaGrad.addColorStop(0.5, 'rgba(255,69,0,0.15)');
  lavaGrad.addColorStop(1, 'rgba(255,69,0,0.3)');
  ctx.fillStyle = lavaGrad;
  ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
}

function drawForestBg() {
  // Fireflies
  for (var i = 0; i < fireflies.length; i++) {
    var f = fireflies[i];
    f.x += f.speedX * speedMultiplier;
    f.y += f.speedY * speedMultiplier;
    f.phase += 0.02;
    if (f.x < -10) f.x = canvas.width + 10;
    if (f.x > canvas.width + 10) f.x = -10;
    if (f.y < canvas.height * 0.15) f.speedY = Math.abs(f.speedY);
    if (f.y > canvas.height * 0.7) f.speedY = -Math.abs(f.speedY);
    var glow = Math.sin(f.phase) * 0.4 + 0.6;
    ctx.globalAlpha = glow * 0.7;
    ctx.shadowBlur = 12;
    ctx.shadowColor = f.color;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Tree silhouettes in background
  ctx.fillStyle = '#0a1a0a';
  for (var i = 0; i < 8; i++) {
    var tx = ((frameCount * 0.3 + i * 180) % (canvas.width + 200)) - 100;
    var th = 60 + Math.sin(i * 1.5) * 30;
    ctx.beginPath();
    ctx.moveTo(tx, groundY);
    ctx.lineTo(tx + 15, groundY - th * 0.3);
    ctx.lineTo(tx + 5, groundY - th * 0.6);
    ctx.lineTo(tx + 25, groundY - th);
    ctx.lineTo(tx + 45, groundY - th * 0.6);
    ctx.lineTo(tx + 35, groundY - th * 0.3);
    ctx.lineTo(tx + 50, groundY);
    ctx.fill();
  }
}

function drawOceanBg() {
  // Bubbles rising
  for (var i = 0; i < bubbles.length; i++) {
    var b = bubbles[i];
    b.y -= b.speed * speedMultiplier;
    b.x += Math.sin(frameCount * 0.03 + b.wobble) * 0.3;
    if (b.y < -10) {
      b.y = canvas.height + 10;
      b.x = Math.random() * canvas.width;
    }
    ctx.globalAlpha = b.alpha;
    ctx.strokeStyle = 'rgba(0,191,255,' + (b.alpha * 0.5) + ')';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 4;
    ctx.shadowColor = '#00bfff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.stroke();
    // Bubble shine
    ctx.fillStyle = 'rgba(255,255,255,' + (b.alpha * 0.3) + ')';
    ctx.beginPath();
    ctx.arc(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Light rays from top
  var rayGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
  rayGrad.addColorStop(0, 'rgba(0,191,255,0.08)');
  rayGrad.addColorStop(0.5, 'rgba(0,191,255,0.02)');
  rayGrad.addColorStop(1, 'rgba(0,191,255,0)');
  ctx.fillStyle = rayGrad;
  for (var i = 0; i < 5; i++) {
    var rx = canvas.width * 0.1 + i * canvas.width * 0.2 + Math.sin(frameCount * 0.01 + i) * 30;
    ctx.beginPath();
    ctx.moveTo(rx - 30, 0);
    ctx.lineTo(rx + 30, 0);
    ctx.lineTo(rx + 80, canvas.height * 0.6);
    ctx.lineTo(rx - 80, canvas.height * 0.6);
    ctx.fill();
  }
}

function drawCyberBg() {
  // Grid lines moving down
  for (var i = 0; i < gridLines.length; i++) {
    var g = gridLines[i];
    g.y += g.speed * speedMultiplier;
    if (g.y > canvas.height) {
      g.y = -g.len;
      g.x = Math.random() * canvas.width;
    }
    ctx.globalAlpha = g.alpha;
    ctx.strokeStyle = 'rgba(211,0,197,' + g.alpha + ')';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#d300c5';
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.lineTo(g.x, g.y + g.len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Horizontal scanlines
  ctx.fillStyle = 'rgba(5,217,232,0.03)';
  for (var y = (frameCount * 2) % 20; y < canvas.height; y += 20) {
    ctx.fillRect(0, y, canvas.width, 1);
  }

  // Digital noise particles
  ctx.fillStyle = 'rgba(5,217,232,0.4)';
  for (var i = 0; i < 20; i++) {
    var nx = Math.random() * canvas.width;
    var ny = Math.random() * canvas.height;
    ctx.fillRect(nx, ny, 1 + Math.random() * 2, 1);
  }
}

// ============================================
// DRAW BACKGROUND
// ============================================

function drawBackground() {
  var bgType = T('bgType');

  // Draw moon and nebulae for all themes (they adapt colors)
  drawMoon();
  drawNebulae();

  // Theme-specific background layers
  if (bgType === 'volcano') {
    drawVolcanoBg();
  } else if (bgType === 'forest') {
    drawForestBg();
  } else if (bgType === 'ocean') {
    drawOceanBg();
  } else if (bgType === 'cyber') {
    drawCyberBg();
  } else {
    drawShootingStars();
  }

  // Stars
  for (var i = 0; i < stars.length; i++) {
    var star = stars[i];
    star.x -= star.speed * speedMultiplier;
    if (star.x < -5) star.x = canvas.width + 5;
    var twinkle = Math.sin(frameCount * 0.05 + star.brightness * 10) * 0.4 + 0.6;
    ctx.fillStyle = star.color;
    ctx.globalAlpha = twinkle * 0.8;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Parallax mountains
  for (var li = 0; li < bgLayers.length; li++) {
    var layer = bgLayers[li];
    layer.offset -= layer.speed * speedMultiplier;
    var shift = layer.offset % 300;

    ctx.fillStyle = layer.color;
    ctx.globalAlpha = 0.6 - li * 0.15;

    for (var mi = 0; mi < layer.mountains.length; mi++) {
      var mt = layer.mountains[mi];
      var mx = mt.x + shift + (li * 100);
      var drawX = ((mx % (canvas.width + 400)) + (canvas.width + 400)) % (canvas.width + 400) - 200;

      ctx.beginPath();
      ctx.moveTo(drawX, groundY);
      ctx.lineTo(drawX + mt.w/2, groundY - mt.h);
      ctx.lineTo(drawX + mt.w, groundY);
      ctx.closePath();
      ctx.fill();

      // Neon ridge
      ctx.strokeStyle = T('ridgeColors')[li];
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.3 - li * 0.08;
      ctx.beginPath();
      ctx.moveTo(drawX + mt.w*0.3, groundY - mt.h*0.4);
      ctx.lineTo(drawX + mt.w/2, groundY - mt.h);
      ctx.lineTo(drawX + mt.w*0.7, groundY - mt.h*0.4);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  // Ground gradient
  var grad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
  grad.addColorStop(0, T('groundTop'));
  grad.addColorStop(0.3, T('groundMid'));
  grad.addColorStop(1, T('groundBot'));
  ctx.fillStyle = grad;
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

  // Ground line
  ctx.shadowBlur = 15;
  ctx.shadowColor = T('groundLine');
  ctx.strokeStyle = T('groundLine');
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(canvas.width, groundY);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Grid lines on ground
  ctx.strokeStyle = T('groundGrid');
  ctx.lineWidth = 1;
  var gridOffset = (frameCount * gameSpeed) % 60;
  for (var x = -gridOffset; x < canvas.width; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x - 100, canvas.height);
    ctx.stroke();
  }

  // Moving ground particles
  ctx.fillStyle = T('groundParticles');
  for (var i = 0; i < 5; i++) {
    var gx = ((frameCount * gameSpeed + i * 150) % (canvas.width + 100)) - 50;
    var gy = groundY + 10 + Math.random() * 5;
    ctx.fillRect(gx, gy, 2 + Math.random() * 3, 1);
  }
}

// ============================================
// DRAW PARTICLES
// ============================================

function drawParticles() {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.globalAlpha = p.life;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// ============================================
// DRAW SPEED LINES
// ============================================

function drawSpeedLines() {
  if (speedMultiplier < 1.5) return;
  ctx.strokeStyle = T('speedLine') + Math.min((speedMultiplier - 1.5) * 0.15, 0.3) + ')';
  ctx.lineWidth = 1;
  for (var i = 0; i < 8; i++) {
    var sx = Math.random() * canvas.width;
    var sy = Math.random() * canvas.height;
    var len = 50 + Math.random() * 100 * speedMultiplier;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - len, sy);
    ctx.stroke();
  }
}

// ============================================
// COLLISION DETECTION
// ============================================

function checkCollision(obs) {
  var k = kitty;
  var kx = k.x + 8;
  var ky = k.y + 5;
  var kw = k.width - 16;
  var kh = k.height - 10;

  var ox = obs.x;
  var oy = obs.y;
  var ow = obs.width;
  var oh = obs.height;

  if (obs.type === 'flying') {
    oy = obs.y + Math.sin(frameCount * 0.08 + obs.floatOffset) * 8;
  }
  if (obs.type === 'laser' && obs.blinkTimer % 120 >= 80) return false;

  return kx < ox + ow && kx + kw > ox && ky < oy + oh && ky + kh > oy;
}

// ============================================
// GAME LOOP - UPDATE
// ============================================

function update() {
  if (!gameRunning || gamePaused) return;

  frameCount++;

  // Track speed tier for milestone sounds
  var prevSpeedTier = Math.floor((speedMultiplier - 1) * 10);

  // Speed progression (ramps a bit faster now, caps at 4.0x for a tougher run)
  speedMultiplier = 1 + Math.min(frameCount / 800, 3.0);
  gameSpeed = baseSpeed * speedMultiplier;

  // Speed milestone sound
  var currSpeedTier = Math.floor((speedMultiplier - 1) * 10);
  if (currSpeedTier > prevSpeedTier && currSpeedTier % 5 === 0) sfxSpeedUp();

  // Update UI
  scoreEl.textContent = Math.floor(score);
  speedEl.textContent = 'SPEED: ' + speedMultiplier.toFixed(1) + 'x';
  speedBar.style.width = Math.min((speedMultiplier - 1) / 3.0 * 100, 100) + '%';

  // Score
  var prevScore = Math.floor(score);
  score += gameSpeed * 0.01;
  var currScore = Math.floor(score);
  if (currScore > prevScore && currScore % 100 === 0) sfxScore();

  // Kitty physics
  kitty.vy += kitty.gravity;
  kitty.y += kitty.vy;

  if (kitty.y + kitty.height >= groundY) {
    kitty.y = groundY - kitty.height;
    kitty.vy = 0;
    kitty.grounded = true;
    if (frameCount % 8 === 0) {
      spawnParticles(kitty.x + 10, groundY, T('groundLine'), 1, 2);
    }
  } else {
    kitty.grounded = false;
  }

  // Ducking
  if (kitty.ducking) {
    kitty.height = kitty.duckHeight;
    if (kitty.grounded) kitty.y = groundY - kitty.height;
  } else {
    kitty.height = kitty.normalHeight;
  }

  updateTrail();

  // Spawn obstacles (denser and less forgiving as speed climbs)
  var spawnRate = Math.max(30, 100 - speedMultiplier * 18);
  if (frameCount % Math.floor(spawnRate) === 0 && Math.random() > Math.max(0.08, 0.3 - speedMultiplier * 0.06)) {
    spawnObstacle();
  }

  // Update obstacles
  for (var i = obstacles.length - 1; i >= 0; i--) {
    var obs = obstacles[i];
    obs.x -= gameSpeed;

    // Collision
    if (checkCollision(obs)) {
      gameOver();
      return;
    }

    // Remove off-screen
    if (obs.x + obs.width < -50) {
      obstacles.splice(i, 1);
    }
  }

  // Update particles position with scroll
  for (var i = 0; i < particles.length; i++) {
    particles[i].x -= gameSpeed * 0.3;
  }

  // Screen shake at high speed
  if (speedMultiplier > 2.5) {
    var shake = (speedMultiplier - 2.5) * 2;
    canvas.style.transform = 'translate(' + (Math.random()*shake - shake/2) + 'px, ' + (Math.random()*shake - shake/2) + 'px)';
  } else {
    canvas.style.transform = 'none';
  }
}

// ============================================
// GAME LOOP - DRAW
// ============================================

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground();
  drawGround();

  // Draw obstacles
  for (var i = 0; i < obstacles.length; i++) {
    drawObstacle(obstacles[i]);
  }

  // Draw kitty
  drawKitty();

  // Draw particles
  drawParticles();

  // Speed lines
  drawSpeedLines();

  // Vignette
  var vig = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.4, canvas.width/2, canvas.height/2, canvas.height*0.8);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, T('vignette'));
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ============================================
// MAIN LOOP
// ============================================

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}


// ============================================
// PAUSE SYSTEM
// ============================================

function togglePause() {
  if (!gameRunning) return;
  gamePaused = !gamePaused;
  if (gamePaused) {
    sfxPause();
    pauseScore.textContent = Math.floor(score);
    pauseScreen.classList.add('active');
    if (pauseHint) pauseHint.classList.add('hidden');
  } else {
    sfxResume();
    pauseScreen.classList.remove('active');
    if (pauseHint) pauseHint.classList.remove('hidden');
  }
}

function resumeGame() {
  if (gamePaused) {
    gamePaused = false;
    sfxResume();
    pauseScreen.classList.remove('active');
    if (pauseHint) pauseHint.classList.remove('hidden');
  }
}

// ============================================
// CONTROLS
// ============================================

function jump() {
  if (!gameRunning || gamePaused) return;
  if (kitty.grounded) {
    kitty.vy = kitty.jumpPower;
    kitty.grounded = false;
    sfxJump();
    spawnParticles(kitty.x + kitty.width/2, groundY, T('jumpParticles1'), 6, 5);
    spawnParticles(kitty.x + kitty.width/2, groundY, T('jumpParticles2'), 4, 4);
  }
}

function duck(start) {
  if (!gameRunning || gamePaused) return;
  if (start && !kitty.ducking) sfxDuck();
  kitty.ducking = start;
}

// ============================================
// GAME STATE MANAGEMENT
// ============================================

function startGame() {
  gameRunning = true;
  score = 0;
  zoroStartSession('kitty');
  frameCount = 0;
  speedMultiplier = 1;
  gameSpeed = baseSpeed;
  obstacles = [];
  particles = [];
  kitty.y = groundY - kitty.height;
  kitty.vy = 0;
  kitty.trail = [];
  kitty.ducking = false;
  kitty.grounded = true;

  startScreen.style.display = 'none';
  gameOverScreen.classList.remove('active');

  initStars();
  initBgLayers();
  initNebulae();
  initMoon();
  initThemeBgElements();
  shootingStars = [];
}

function gameOver() {
  gameRunning = false;
  canvas.style.transform = 'none';
  stopBGM();
  sfxCrash();

  // Explosion particles
  var crashCols = T('crashParticles');
  spawnParticles(kitty.x + kitty.width/2, kitty.y + kitty.height/2, crashCols[0], 30, 10);
  spawnParticles(kitty.x + kitty.width/2, kitty.y + kitty.height/2, crashCols[1], 20, 8);
  spawnParticles(kitty.x + kitty.width/2, kitty.y + kitty.height/2, crashCols[2], 15, 6);

  // Update high score
  var finalScore = Math.floor(score);
  if (finalScore > highScore) {
    highScore = finalScore;
    try { localStorage.setItem('kittyDashHigh', highScore); } catch(e) {}
  }

  finalScoreEl.textContent = finalScore;
  highScoreEl.textContent = 'Best: ' + highScore;
  gameOverScreen.classList.add('active');

  // Real Zoro Hub reward -- tier thresholds are a first-pass estimate
  // (score scales with gameSpeed, which ramps over time) -- tune once
  // there's real playtesting data, same as every other game's curve.
  var tier = 'low';
  if (finalScore >= 400) tier = 'exceptional';
  else if (finalScore >= 150) tier = 'high';
  else if (finalScore >= 50) tier = 'good';
  zoroReportResult('kitty', tier).then(function(reward) {
    if (reward) {
      var rewardEl = document.createElement('div');
      rewardEl.className = 'kitty-reward-line';
      rewardEl.textContent = '+' + reward.coins_awarded + ' Coins, +' + reward.xp_awarded + ' XP';
      finalScoreEl.insertAdjacentElement('afterend', rewardEl);
    }
  });
}

// ============================================
// EVENT LISTENERS
// ============================================

startBtn.addEventListener('click', function() {
  initAudio();
  sfxStart();
  startGame();
  startBGM();
});

restartBtn.addEventListener('click', function() {
  initAudio();
  sfxStart();
  startGame();
  startBGM();
});
resumeBtn.addEventListener('click', function() {
  resumeGame();
});


window.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (gamePaused) {
      resumeGame();
    } else if (!gameRunning && gameOverScreen.classList.contains('active')) {
      startGame();
    } else {
      jump();
    }
  }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    togglePause();
  }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') {
    e.preventDefault();
    duck(true);
  }
});

window.addEventListener('keyup', function(e) {
  if (e.code === 'ArrowDown' || e.code === 'KeyS') {
    e.preventDefault();
    duck(false);
  }
});

// Touch controls
container.addEventListener('touchstart', function(e) {
  e.preventDefault();
  initAudio();
  var touch = e.touches[0];
  var rect = container.getBoundingClientRect();
  var y = touch.clientY - rect.top;

  if (!gameRunning && gameOverScreen.classList.contains('active')) {
    sfxStart();
    startGame();
    startBGM();
    return;
  }

  if (y > rect.height * 0.7) {
    duck(true);
  } else {
    jump();
  }
}, { passive: false });

container.addEventListener('touchend', function(e) {
  e.preventDefault();
  duck(false);
}, { passive: false });

container.addEventListener('mousedown', function(e) {
  initAudio();
  if (!gameRunning && gameOverScreen.classList.contains('active')) {
    sfxStart();
    startGame();
    startBGM();
    return;
  }
  jump();
});


// ============================================
// THEME SWITCHER EVENTS
// ============================================

var themeBtns = document.querySelectorAll('.theme-btn');
for (var i = 0; i < themeBtns.length; i++) {
  themeBtns[i].addEventListener('click', function(e) {
    e.stopPropagation();
    setTheme(this.dataset.theme);
  });
}

// Set active button on load
var btns = document.querySelectorAll('.theme-btn');
for (var i = 0; i < btns.length; i++) {
  btns[i].classList.toggle('active', btns[i].dataset.theme === currentTheme);
}

// Pause screen click to resume
pauseScreen.addEventListener('click', function(e) {
  if (e.target === pauseScreen || e.target.id === 'resumeBtn') {
    resumeGame();
  }
});

// ============================================
// BOOT
// ============================================

groundY = canvas.height - 80;
kitty.y = groundY - kitty.height;
initStars();
initBgLayers();
initNebulae();
initMoon();

initThemeBgElements();loop();

</script>
</body>
</html>
