<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zoro Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

<canvas id="bgCanvas"></canvas>

<div class="overlay"></div>

<div class="login-card">

<div class="logo">

<h1>ZORO HUB</h1>

<p>Welcome Back, Gamer.</p>

</div>

<form method="POST">

<div class="input-group">

<input
type="text"
name="username"
required>

<label>Username</label>

</div>

<div class="input-group">

    <input
        type="password"
        id="password"
        name="password"
        required>

    <label>Password</label>

    <span id="togglePassword" class="eye">
        👁
    </span>

</div>

<div class="buttons">

<button
type="submit"
name="action"
value="login">

LOGIN

</button>

<button
type="submit"
name="action"
value="register">

CREATE ACCOUNT

</button>

</div>

</form>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>

</html>
