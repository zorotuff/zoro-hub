<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Personalize • Zoro Hub

</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/personalize.css') }}">

</head>

<body>

<div class="background">

<div class="gradient gradient-1"></div>

<div class="gradient gradient-2"></div>

<div class="noise"></div>

</div>

<div class="page">

<!-- ==========================
        NAVBAR
========================== -->

<header class="navbar">

<a
href="{{ url_for('hub') }}"
class="back-btn">

← Hub

</a>

<h1>

🎨 Personalize

</h1>

</header>

<!-- ==========================
        PROFILE PREVIEW
========================== -->

<section class="preview-card">

<div class="avatar-frame">

<img
id="previewAvatar"
class="preview-avatar"
src="{{ avatar_src }}"
alt="Avatar">

</div>

<div class="preview-info">

<h2 id="previewName">

{{ profile.username }}

</h2>

<p>

Level {{ profile.level }}

</p>

<div
id="previewBadge"
class="preview-badge">

{{ profile.badge if profile.badge else "No Badge" }}

</div>

</div>

</section>

<!-- ==========================
        AVATAR INVENTORY
========================== -->

<section class="option-card">

<h3>

🖼 Choose Avatar

</h3>

<div
class="inventory-grid"
id="avatarInventory">

</div>

</section>

<!-- ==========================
        CUSTOMIZATION GRID
========================== -->

<div class="option-card">

<h3>

 Banner

</h3>

<div class="option-list"

id="bannerList">

<!-- JS -->

</div>

</div>

<div class="option-card">

<h3>

 Border

</h3>

<div class="option-list"

id="borderList">

<!-- JS -->

</div>

</div>

<div class="option-card">

<h3>

 Theme

</h3>

<div class="option-list"

id="themeList">

<!-- JS -->

</div>

</div>

<div class="option-card">

<h3>

 Username Color

</h3>

<div class="option-list"

id="nameColorList">

<!-- JS -->

</div>

</div>

<div class="option-card">

<h3>

 Badge

</h3>

<div class="option-list"

id="badgeList">

<!-- JS -->

</div>

</div>

</section>

<!-- ==========================
        SAVE
========================== -->

<div class="save-area">

<button

id="saveBtn"

class="save-btn">

💾 Save Changes

</button>

</div>

</div>

<script
src="{{ url_for('static', filename='js/personalize.js') }}">

</script>

</body>

</html>
