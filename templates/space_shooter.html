<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Void - Space Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020205;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        #gameCanvas {
            display: block;
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.4), 0 0 120px rgba(100, 0, 200, 0.3);
        }
        .ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(2, 2, 8, 0.94);
            z-index: 10;
            transition: opacity 0.5s;
        }
        .ui-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .title {
            font-size: 64px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 8px;
            background: linear-gradient(180deg, #00ffff, #0088ff, #8800ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.5);
            margin-bottom: 20px;
            animation: titlePulse 2s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.3); }
        }
        .subtitle {
            font-size: 18px;
            color: #88aaff;
            letter-spacing: 4px;
            margin-bottom: 50px;
            opacity: 0.8;
        }
        .btn {
            padding: 15px 50px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            transform: scale(1.1);
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }
        .btn:hover::before { left: 100%; }
        .controls-info {
            margin-top: 40px;
            font-size: 14px;
            color: #6688aa;
            text-align: center;
            line-height: 2;
        }
        .controls-info span { color: #00ffff; font-weight: bold; }
        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.8);
        }
        .hud-item { display: flex; align-items: center; gap: 10px; }
        .hud-label { color: #6688aa; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        .hud-value { color: #00ffff; font-weight: bold; font-size: 22px; }
        .health-bar {
            width: 200px; height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0044, #ff8800, #00ff88);
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        .game-over-stats { text-align: center; margin: 30px 0; }
        .stat-row { display: flex; justify-content: space-between; width: 300px; margin: 10px auto; font-size: 18px; }
        .stat-label { color: #6688aa; }
        .stat-value { color: #00ffff; font-weight: bold; }
        .wave-announce {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #ff00ff;
            text-shadow: 0 0 30px rgba(255, 0, 255, 0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            text-transform: uppercase;
            letter-spacing: 6px;
        }
        .weapon-indicator {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 5;
        }
        .weapon-slot {
            width: 45px; height: 45px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
            position: relative;
        }
        .weapon-slot.active {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            background: rgba(0, 255, 255, 0.1);
        }
        .weapon-slot.locked { opacity: 0.3; border-color: #444; }
        .weapon-slot .lock-icon {
            position: absolute;
            font-size: 10px;
            bottom: 2px; right: 2px;
            color: #ff4444;
        }
        .boss-health-bar {
            position: absolute;
            top: 70px; left: 50%;
            transform: translateX(-50%);
            width: 400px; height: 12px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            border-radius: 6px;
            overflow: hidden;
            z-index: 5;
            display: none;
        }
        .boss-health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff4444, #ff8800);
            transition: width 0.2s;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        .boss-name {
            position: absolute;
            top: 52px; left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #ff4444;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 5;
            display: none;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }
        .unlock-notify {
            position: absolute;
            top: 60%; left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            letter-spacing: 3px;
            transition: opacity 0.5s;
        }

       /* ===== MOBILE HUD TWEAKS ===== */
@media (max-width: 900px) {
  body, canvas { touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .hud { top: 6px; left: 8px; right: 8px; font-size: 12px; }
  .hud-value { font-size: 15px; }
  .health-bar { width: 100px; height: 5px; }
  .weapon-indicator { bottom: 140px; gap: 5px; }
  .weapon-slot { width: 30px; height: 30px; font-size: 12px; }
  .boss-health-bar { width: 80vw; top: 40px; height: 9px; }
  .boss-name { top: 26px; font-size: 10px; }
  .title { font-size: 32px; letter-spacing: 4px; }
  .subtitle { font-size: 14px; margin-bottom: 24px; }
  .btn { padding: 10px 28px; font-size: 15px; }
  .controls-info { display: none; }
  .game-over-stats { margin: 16px 0; }
  .stat-row { width: 220px; margin: 6px auto; font-size: 15px; }
}

    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="hud" id="hud" style="display: none;">
        <div>
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span class="hud-value" id="scoreDisplay">0</span>
            </div>
            <div class="health-bar">
                <div class="health-fill" id="healthFill" style="width: 100%"></div>
            </div>
        </div>
        <div class="hud-item">
            <span class="hud-label">Wave</span>
            <span class="hud-value" id="waveDisplay">1</span>
        </div>
    </div>

    <div class="boss-name" id="bossName">VOID OVERLORD</div>
    <div class="boss-health-bar" id="bossHealthBar">
        <div class="boss-health-fill" id="bossHealthFill" style="width: 100%"></div>
    </div>

    <div class="weapon-indicator" id="weaponIndicator" style="display: none;">
        <div class="weapon-slot active" id="w1">1</div>
        <div class="weapon-slot" id="w2">2</div>
        <div class="weapon-slot locked" id="w3">3<span class="lock-icon">&#128274;</span></div>
        <div class="weapon-slot locked" id="w4">4<span class="lock-icon">&#128274;</span></div>
        <div class="weapon-slot locked" id="w5">5<span class="lock-icon">&#128274;</span></div>
    </div>

    <div class="wave-announce" id="waveAnnounce"></div>
    <div class="unlock-notify" id="unlockNotify"></div>

    <div class="ui-overlay" id="startScreen">
        <div class="title">Neon Void</div>
        <div class="subtitle">Space Shooter</div>
        <button class="btn" id="startBtn">Initialize</button>
        <div class="controls-info">
            <span>WASD / Arrows</span> to Move<br>
            <span>SPACE</span> to Shoot<br>
            <span>1-5</span> to Switch Weapons<br>
            <span>P</span> to Pause
        </div>
    </div>

    <div class="ui-overlay hidden" id="gameOverScreen">
        <div class="title" style="font-size: 48px; background: linear-gradient(180deg, #ff0044, #ff8800);">Mission Failed</div>
        <div class="game-over-stats">
            <div class="stat-row">
                <span class="stat-label">Final Score</span>
                <span class="stat-value" id="finalScore">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Waves Survived</span>
                <span class="stat-value" id="finalWave">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Enemies Destroyed</span>
                <span class="stat-value" id="finalKills">0</span>
            </div>
        </div>
        <button class="btn" id="restartBtn">Reinitialize</button>
    </div>

    

    <script>

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth, 1200);
            canvas.height = Math.min(window.innerHeight, 900);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            switch(type) {
                case 'shoot':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'enemyShoot':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'explosion':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'powerup':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'hit':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'bossAlert':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'unlock':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
            }
        }

        let gameState = 'menu';
        let score = 0;
        let wave = 1;
        let kills = 0;
        let screenShake = 0;
        let frameCount = 0;
        let highestWaveReached = 1;

        const weaponUnlocks = {
            0: 0,
            1: 0,
            2: 2,
            3: 5,
            4: 8
        };

        const keys = {};
        window.addEventListener('keydown', e => {
            if (e.key === ' ') {
                e.preventDefault();
            }
            keys[e.key.toLowerCase()] = true;

            const num = parseInt(e.key);
            if (num >= 1 && num <= 5) {
                const wIdx = num - 1;
                if (highestWaveReached > weaponUnlocks[wIdx]) {
                    player.weapon = wIdx;
                } else if (highestWaveReached === weaponUnlocks[wIdx]) {
                    player.weapon = wIdx;
                }
            }

            if (e.key.toLowerCase() === 'p' && (gameState === 'playing' || gameState === 'paused')) {
                if (gameState === 'playing') {
                    gameState = 'paused';
                    document.getElementById('startScreen').classList.remove('hidden');
                    document.querySelector('#startScreen .title').textContent = 'Paused';
                    document.querySelector('#startScreen .subtitle').textContent = 'Press Resume to Continue';
                    document.getElementById('startBtn').textContent = 'Resume';
                } else {
                    gameState = 'playing';
                    document.getElementById('startScreen').classList.add('hidden');
                }
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });

        function dist(x1, y1, x2, y2) {
            return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
        }

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // === CRAZY NEW BACKGROUND SYSTEM ===
        let bgPhase = 0; // 0 = normal, 1 = boss
        let bgPhaseTransition = 0;
        let currentBossTheme = 0;

        // Aurora / energy wave system
        const auroraWaves = [];
        for (let i = 0; i < 6; i++) {
            auroraWaves.push({
                y: random(0, canvas.height),
                amplitude: random(30, 80),
                frequency: random(0.003, 0.008),
                speed: random(0.5, 2),
                phase: random(0, Math.PI * 2),
                color: ['rgba(0, 200, 255, 0.08)', 'rgba(100, 0, 200, 0.08)', 'rgba(0, 255, 150, 0.06)', 'rgba(200, 0, 100, 0.07)', 'rgba(0, 100, 255, 0.07)', 'rgba(255, 100, 0, 0.06)'][i],
                width: random(2, 5)
            });
        }

        // Floating geometric shapes
        const geoShapes = [];
        for (let i = 0; i < 15; i++) {
            geoShapes.push({
                x: random(0, canvas.width),
                y: random(0, canvas.height),
                size: random(10, 40),
                vx: random(-0.3, 0.3),
                vy: random(-0.3, 0.3),
                rotation: random(0, Math.PI * 2),
                rotSpeed: random(-0.01, 0.01),
                type: Math.floor(random(0, 3)), // 0=triangle, 1=square, 2=hex
                color: ['rgba(0, 200, 255, 0.15)', 'rgba(200, 0, 255, 0.12)', 'rgba(0, 255, 150, 0.13)', 'rgba(255, 200, 0, 0.1)', 'rgba(255, 0, 100, 0.12)'][Math.floor(random(0, 5))],
                pulsePhase: random(0, Math.PI * 2)
            });
        }

        // Deep space warp rings
        const warpRings = [];
        for (let i = 0; i < 8; i++) {
            warpRings.push({
                cx: canvas.width / 2,
                cy: canvas.height / 2,
                radius: random(50, 400),
                speed: random(0.2, 0.8),
                alpha: random(0.03, 0.08),
                color: ['rgba(0, 150, 255, ', 'rgba(100, 0, 200, ', 'rgba(0, 255, 200, ', 'rgba(200, 50, 255, '][Math.floor(random(0, 4))]
            });
        }

        // Layered parallax stars with orbital motion
        const starLayers = [
            { count: 200, speed: 0.3, sizeRange: [0.5, 1.5], alpha: 0.5, color: '#ffffff' },
            { count: 120, speed: 1.0, sizeRange: [0.8, 2], alpha: 0.7, color: '#aaddff' },
            { count: 60, speed: 2.2, sizeRange: [1.2, 2.8], alpha: 0.9, color: '#ffeedd' },
            { count: 30, speed: 3.5, sizeRange: [1.5, 3.5], alpha: 1.0, color: '#ffffff' }
        ];

        const allStars = [];
        starLayers.forEach((layer, li) => {
            for (let i = 0; i < layer.count; i++) {
                allStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: random(layer.sizeRange[0], layer.sizeRange[1]),
                    speed: layer.speed,
                    baseAlpha: layer.alpha,
                    color: layer.color,
                    layer: li,
                    twinkleOffset: Math.random() * Math.PI * 2,
                    twinkleSpeed: random(0.02, 0.1),
                    orbitAngle: random(0, Math.PI * 2),
                    orbitRadius: random(0, 30),
                    orbitSpeed: random(-0.02, 0.02)
                });
            }
        });

        // Shooting stars
        const shootingStars = [];
        for (let i = 0; i < 4; i++) {
            shootingStars.push({
                x: random(-100, canvas.width),
                y: random(-100, canvas.height * 0.4),
                vx: random(6, 14),
                vy: random(1, 4),
                life: 0,
                maxLife: random(30, 70),
                active: false,
                timer: random(80, 350)
            });
        }

        // Floating energy orbs
        const energyOrbs = [];
        for (let i = 0; i < 8; i++) {
            energyOrbs.push({
                x: random(0, canvas.width),
                y: random(0, canvas.height),
                radius: random(20, 60),
                vx: random(-0.5, 0.5),
                vy: random(-0.5, 0.5),
                pulseSpeed: random(0.02, 0.05),
                pulsePhase: random(0, Math.PI * 2),
                color: ['rgba(0, 200, 255, 0.15)', 'rgba(200, 0, 255, 0.12)', 'rgba(0, 255, 150, 0.13)', 'rgba(255, 200, 0, 0.1)'][Math.floor(random(0, 4))]
            });
        }

        // Normal nebulae
        const nebulaeNormal = [];
        for (let i = 0; i < 5; i++) {
            nebulaeNormal.push({
                x: random(0, canvas.width),
                y: random(0, canvas.height),
                radius: random(150, 400),
                color: ['rgba(60, 0, 180, 0.22)', 'rgba(0, 60, 180, 0.22)', 'rgba(160, 0, 120, 0.2)', 'rgba(0, 160, 140, 0.18)', 'rgba(40, 0, 220, 0.2)'][i],
                drift: random(-0.15, 0.15),
                pulseSpeed: random(0.005, 0.015),
                pulseOffset: Math.random() * Math.PI * 2
            });
        }

        // === PER-WAVE BOSS THEMES ===
        const bossThemes = {
            1: {
                name: 'INFERNO OVERLORD',
                baseColor: { r: 25, g: 2, b: 0 },
                nebulae: [
                    { color: 'rgba(200, 40, 0, 0.3)', radius: [180, 450], drift: [-0.3, 0.3] },
                    { color: 'rgba(255, 80, 0, 0.25)', radius: [150, 400], drift: [-0.2, 0.2] },
                    { color: 'rgba(180, 0, 0, 0.28)', radius: [200, 500], drift: [-0.25, 0.25] },
                    { color: 'rgba(255, 120, 0, 0.2)', radius: [120, 350], drift: [-0.15, 0.15] },
                    { color: 'rgba(160, 20, 0, 0.25)', radius: [160, 420], drift: [-0.2, 0.2] }
                ],
                starColor: '#ffaa66',
                starDim: 0.5,
                lightningColor: '255, 60, 0',
                lightningRate: 0.004,
                vignetteColor: '100, 10, 0',
                auroraColors: ['rgba(255, 80, 0, 0.1)', 'rgba(200, 40, 0, 0.08)', 'rgba(255, 120, 0, 0.09)'],
                geoColors: ['rgba(255, 80, 0, 0.2)', 'rgba(200, 40, 0, 0.18)', 'rgba(255, 150, 0, 0.15)']
            },
            2: {
                name: 'VOID REAPER',
                baseColor: { r: 8, g: 0, b: 15 },
                nebulae: [
                    { color: 'rgba(120, 0, 200, 0.3)', radius: [180, 450], drift: [-0.3, 0.3] },
                    { color: 'rgba(80, 0, 160, 0.28)', radius: [150, 400], drift: [-0.2, 0.2] },
                    { color: 'rgba(160, 0, 255, 0.25)', radius: [200, 500], drift: [-0.25, 0.25] },
                    { color: 'rgba(60, 0, 120, 0.3)', radius: [120, 350], drift: [-0.15, 0.15] },
                    { color: 'rgba(100, 0, 180, 0.27)', radius: [160, 420], drift: [-0.2, 0.2] }
                ],
                starColor: '#cc88ff',
                starDim: 0.4,
                lightningColor: '150, 0, 255',
                lightningRate: 0.005,
                vignetteColor: '60, 0, 100',
                auroraColors: ['rgba(150, 0, 255, 0.1)', 'rgba(100, 0, 200, 0.08)', 'rgba(180, 0, 255, 0.09)'],
                geoColors: ['rgba(150, 0, 255, 0.2)', 'rgba(100, 0, 200, 0.18)', 'rgba(180, 0, 255, 0.15)']
            },
            3: {
                name: 'CYBER TITAN',
                baseColor: { r: 0, g: 15, b: 5 },
                nebulae: [
                    { color: 'rgba(0, 255, 100, 0.25)', radius: [180, 450], drift: [-0.3, 0.3] },
                    { color: 'rgba(0, 200, 80, 0.22)', radius: [150, 400], drift: [-0.2, 0.2] },
                    { color: 'rgba(0, 255, 150, 0.2)', radius: [200, 500], drift: [-0.25, 0.25] },

            }
        };

        // Generate boss nebulae for current wave
        let nebulaeBoss = [];

        function generateBossNebulae(waveNum) {
            const theme = bossThemes[Math.min(waveNum, 5)];
            nebulaeBoss = [];
            for (let i = 0; i < 5; i++) {
                const neb = theme.nebulae[i];
                nebulaeBoss.push({
                    x: random(0, canvas.width),
                    y: random(0, canvas.height),
                    radius: random(neb.radius[0], neb.radius[1]),
                    color: neb.color,
                    drift: random(neb.drift[0], neb.drift[1]),
                    pulseSpeed: random(0.01, 0.03),
                    pulseOffset: Math.random() * Math.PI * 2
                });
            }
        }

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 40,
            height: 50,
            speed: 6,
            health: 100,
            maxHealth: 100,
            weapon: 0,
            shootTimer: 0,
            invincible: 0,
            trail: []
        };

        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];

        const enemyTypes = [
            { name: 'drone', health: 30, speed: 2, score: 100, color: '#ff4444', size: 20, shootRate: 0 },
            { name: 'fighter', health: 60, speed: 3, score: 200, color: '#ff8800', size: 25, shootRate: 0.005 },
            { name: 'heavy', health: 150, speed: 1, score: 500, color: '#ff00ff', size: 35, shootRate: 0.003 },
            { name: 'speeder', health: 20, speed: 5, score: 150, color: '#00ff88', size: 15, shootRate: 0 },
            { name: 'interceptor', health: 40, speed: 4, score: 180, color: '#ffaa00', size: 22, shootRate: 0.008 },
            { name: 'bomber', health: 200, speed: 0.8, score: 600, color: '#aa00ff', size: 40, shootRate: 0.01 }
        ];

        let waveTimer = 0;
        let enemiesToSpawn = 0;
        let spawnTimer = 0;
        let bossSpawned = false;
        let currentBoss = null;

        function showUnlockNotification(text) {
            const notify = document.getElementById('unlockNotify');
            notify.textContent = text;
            notify.style.opacity = '1';
            notify.style.transition = 'none';
            setTimeout(() => {
                notify.style.transition = 'opacity 2s ease-out';
                notify.style.opacity = '0';
            }, 2000);
        }

        function updateWeaponUI() {
            for (let i = 0; i < 5; i++) {
                const slot = document.getElementById('w' + (i + 1));
                const required = weaponUnlocks[i];
                const unlocked = highestWaveReached > required || (highestWaveReached === required && wave > required);

                slot.classList.toggle('locked', !unlocked);
                slot.classList.toggle('active', player.weapon === i && unlocked);

                if (!unlocked) {
                    slot.innerHTML = (i + 1) + '<span class="lock-icon">&#128274;</span>';
                } else {
                    slot.innerHTML = (i + 1);
                }
            }
        }

        function checkWeaponUnlocks() {
            const newUnlocks = [];
            if (highestWaveReached === 3 && wave === 3) {
                newUnlocks.push('Weapon 3 Unlocked!');
                playSound('unlock');
            }
            if (highestWaveReached === 6 && wave === 6) {
                newUnlocks.push('Weapon 4 Unlocked!');
                playSound('unlock');
            }
            if (highestWaveReached === 9 && wave === 9) {
                newUnlocks.push('Weapon 5 Unlocked!');
                playSound('unlock');
            }

            newUnlocks.forEach((msg, i) => {
                setTimeout(() => showUnlockNotification(msg), i * 1500);
            });
        }

        function startWave() {
            waveTimer = 0;
            enemiesToSpawn = 6 + wave * 3 + Math.floor(wave / 2) * 2;
            spawnTimer = 0;
            bossSpawned = false;
            currentBoss = null;

            document.getElementById('bossHealthBar').style.display = 'none';
            document.getElementById('bossName').style.display = 'none';

            const announce = document.getElementById('waveAnnounce');
            announce.textContent = 'Wave ' + wave;
            announce.style.opacity = '1';
            announce.style.transform = 'translate(-50%, -50%) scale(1.5)';
            announce.style.transition = 'none';
            setTimeout(() => {
                announce.style.transition = 'all 1s ease-out';
                announce.style.opacity = '0';
                announce.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 100);
            setTimeout(() => {
                announce.style.transition = '';
            }, 1100);

            checkWeaponUnlocks();
            updateWeaponUI();
        }

        function spawnEnemy() {
            let types;
            if (wave < 3) {
                types = [0, 0, 3, 4];
            } else if (wave < 5) {
                types = [0, 1, 3, 4];
            } else if (wave < 7) {
                types = [0, 1, 2, 3, 4];
            } else {
                types = [0, 1, 2, 3, 4, 5];
            }

            const typeIdx = types[Math.floor(Math.random() * types.length)];
            const type = enemyTypes[typeIdx];

            enemies.push({
                x: random(50, canvas.width - 50),
                y: -50,
                ...type,
                vx: random(-1, 1),
                vy: type.speed * (1 + wave * 0.1),
                maxHealth: type.health,
                angle: 0,
                wobble: random(0, Math.PI * 2)
            });
        }

        function spawnBoss() {
            const bossHealth = 300 + wave * 250;
            const theme = bossThemes[Math.min(wave, 5)];
            const boss = {
                x: canvas.width / 2,
                y: -100,
                name: 'boss',
                health: bossHealth,
                maxHealth: bossHealth,
                speed: 0.5 + wave * 0.1,
                score: 1000 + wave * 500,
                color: '#ff0000',
                size: 50 + wave * 5,
                shootRate: Math.min(0.04, 0.015 + wave * 0.003),
                vx: 0,
                vy: 0.5,
                angle: 0,
                wobble: 0,
                phase: 0,
                isBoss: true,
                patternTimer: 0,
                attackPattern: 0
            };
            enemies.push(boss);
            currentBoss = boss;
            bossSpawned = true;
            currentBossTheme = Math.min(wave, 5);
            generateBossNebulae(wave);

            bgPhase = 1;

            playSound('bossAlert');

            document.getElementById('bossHealthBar').style.display = 'block';
            document.getElementById('bossName').style.display = 'block';
            document.getElementById('bossName').textContent = theme.name + ' - Wave ' + wave;

            const announce = document.getElementById('waveAnnounce');
            announce.textContent = 'BOSS INCOMING';
            announce.style.color = '#ff0000';
            announce.style.opacity = '1';
            announce.style.transform = 'translate(-50%, -50%) scale(1.8)';
            announce.style.transition = 'none';
            setTimeout(() => {
                announce.style.transition = 'all 1.5s ease-out';
                announce.style.opacity = '0';
                announce.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 100);
            setTimeout(() => {
                announce.style.transition = '';
                announce.style.color = '#ff00ff';
            }, 1600);
        }

        function createExplosion(x, y, color, count) {
            count = count || 20;
            for (let i = 0; i < count; i++) {
                const angle = random(0, Math.PI * 2);
                const speed = random(2, 8);
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: random(0.02, 0.05),
                    color: color,
                    size: random(2, 6)
                });
            }
        }

        function createTrail(x, y, color) {
            particles.push({
                x: x + random(-5, 5),
                y: y + random(-5, 5),
                vx: random(-0.5, 0.5),
                vy: random(1, 3),
                life: 0.5,
                decay: 0.03,
                color: color,
                size: random(1, 3)
            });
        }

        function update() {
            if (gameState !== 'playing') return;

            frameCount++;

            if (screenShake > 0) screenShake *= 0.9;
            if (screenShake < 0.5) screenShake = 0;

            // Background phase transition
            if (bgPhase === 1 && bgPhaseTransition < 1) {
                bgPhaseTransition += 0.008;
                if (bgPhaseTransition > 1) bgPhaseTransition = 1;
            } else if (bgPhase === 0 && bgPhaseTransition > 0) {
                bgPhaseTransition -= 0.008;
                if (bgPhaseTransition < 0) bgPhaseTransition = 0;
            }

            let dx = 0, dy = 0;
            if (keys['arrowleft'] || keys['a']) dx = -1;
            if (keys['arrowright'] || keys['d']) dx = 1;
            if (keys['arrowup'] || keys['w']) dy = -1;
            if (keys['arrowdown'] || keys['s']) dy = 1;

            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx*dx + dy*dy);
                dx /= len;
                dy /= len;
            }

            player.x += dx * player.speed;
            player.y += dy * player.speed;
            player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
            player.y = Math.max(30, Math.min(canvas.height - 30, player.y));

            if (frameCount % 3 === 0) {
                player.trail.push({ x: player.x, y: player.y + 20, life: 1 });
            }
            player.trail.forEach(t => t.life -= 0.05);
            player.trail = player.trail.filter(t => t.life > 0);

            if (player.invincible > 0) player.invincible--;

            // Shooting with 5 weapon types
            if (keys[' '] && player.shootTimer <= 0) {
                const w = player.weapon;
                playSound('shoot');

                if (w === 0) {
                    bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -14, damage: 30, color: '#00ffff', size: 4 });
                    player.shootTimer = 7;
                } else if (w === 1) {
                    bullets.push({ x: player.x - 10, y: player.y - 15, vx: -2, vy: -11, damage: 22, color: '#ff00ff', size: 5 });
                    bullets.push({ x: player.x + 10, y: player.y - 15, vx: 2, vy: -11, damage: 22, color: '#ff00ff', size: 5 });
                    bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -13, damage: 22, color: '#ff00ff', size: 5 });
                    player.shootTimer = 11;
                } else if (w === 2) {
                    for (let i = -2; i <= 2; i++) {
                        const angle = -Math.PI/2 + i * 0.12;
                        bullets.push({
                            x: player.x, y: player.y - 20,
                            vx: Math.cos(angle) * 11,
                            vy: Math.sin(angle) * 11,
                            damage: 18, color: '#ffff00', size: 3
                        });
                    }
                    player.shootTimer = 14;
                } else if (w === 3) {
                    bullets.push({
                        x: player.x - 10, y: player.y - 20,
                        vx: 0, vy: -12,
                        damage: 12, color: '#ff6666', size: 5,
                        piercing: true
                    });
                    bullets.push({
                        x: player.x + 10, y: player.y - 20,
                        vx: 0, vy: -12,
                        damage: 12, color: '#ff6666', size: 5,
                        piercing: true
                    });
                    player.shootTimer = 26;
                } else if (w === 4) {
                    for (let i = 0; i < 12; i++) {
                        const angle = (Math.PI * 2 / 12) * i - Math.PI/2;
                        bullets.push({
                            x: player.x, y: player.y - 20,
                            vx: Math.cos(angle) * 10,
                            vy: Math.sin(angle) * 10,
                            damage: 30, color: '#c77dff', size: 5,
                            isNova: true
                        });
                    }
                    bullets.push({ x: player.x - 8, y: player.y - 20, vx: 0, vy: -15, damage: 50, color: '#ffffff', size: 7, isNova: true });
                    bullets.push({ x: player.x + 8, y: player.y - 20, vx: 0, vy: -15, damage: 50, color: '#ffffff', size: 7, isNova: true });
                    player.shootTimer = 16;
                }
            }
            if (player.shootTimer > 0) player.shootTimer--;

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                createTrail(b.x, b.y, b.color);
                if (b.y < -50 || b.x < -50 || b.x > canvas.width + 50) {
                    bullets.splice(i, 1);
                }
            }

            // Update enemy bullets
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.y > canvas.height + 50 || b.x < -50 || b.x > canvas.width + 50) {
                    enemyBullets.splice(i, 1);
                }
            }

            // Wave logic
            waveTimer++;
            if (enemiesToSpawn > 0) {
                spawnTimer++;
                if (spawnTimer > Math.max(20, 90 - wave * 6)) {
                    spawnEnemy();
                    enemiesToSpawn--;
                    spawnTimer = 0;
                }
            } else if (!bossSpawned) {
                if (enemies.filter(e => !e.isBoss).length === 0) {
                    spawnBoss();
                }
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.wobble += 0.05;

                if (e.isBoss) {
                    e.phase += 0.02 + wave * 0.002;
                    e.patternTimer++;

                    const pattern = wave % 3;
                    if (pattern === 0) {
                        e.x = canvas.width/2 + Math.sin(e.phase) * (200 - wave * 10);
                        e.y = 100 + Math.sin(e.phase * 2) * 30;
                    } else if (pattern === 1) {
                        e.x = canvas.width/2 + Math.sin(e.phase) * (250 - wave * 15);
                        e.y = 80 + Math.abs(Math.sin(e.phase * 3)) * 60;
                    } else {
                        e.x = canvas.width/2 + Math.cos(e.phase) * (180 - wave * 5);
                        e.y = 120 + Math.sin(e.phase * 1.5) * 40;
                    }

                    if (e.y < 80) {
                        e.y += 1;
                    }

                    if (Math.random() < e.shootRate) {
                        playSound('enemyShoot');
                        const numShots = Math.min(7, 3 + Math.floor(wave / 2));
                        const spread = Math.min(1.2, 0.4 + wave * 0.08);
                        for (let j = 0; j < numShots; j++) {
                            const angle = Math.PI/2 + (j - (numShots-1)/2) * spread / numShots;
                            const speed = 3 + wave * 0.3;
                            enemyBullets.push({
                                x: e.x, y: e.y + e.size * 0.7,
                                vx: Math.cos(angle) * speed,
                                vy: Math.sin(angle) * speed,
                                damage: 10 + wave * 2, color: '#ff4444', size: 5
                            });
                        }
                    }

                    if (Math.random() < e.shootRate * 0.5) {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        enemyBullets.push({
                            x: e.x, y: e.y + e.size * 0.7,
                            vx: Math.cos(angle) * (5 + wave * 0.2),
                            vy: Math.sin(angle) * (5 + wave * 0.2),
                            damage: 15 + wave * 2, color: '#ff8800', size: 6
                        });
                    }

                    if (currentBoss === e) {
                        const hpPercent = Math.max(0, e.health / e.maxHealth * 100);
                        document.getElementById('bossHealthFill').style.width = hpPercent + '%';
                    }
                } else {
                    e.x += Math.sin(e.wobble) * 2 + e.vx;
                    e.y += e.vy;

                    if (e.x < 30 || e.x > canvas.width - 30) e.vx *= -1;

                    if (e.shootRate > 0 && Math.random() < e.shootRate) {
                        playSound('enemyShoot');
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        enemyBullets.push({
                            x: e.x, y: e.y + 20,
                            vx: Math.cos(angle) * 5,
                            vy: Math.sin(angle) * 5,
                            damage: 10, color: '#ff4444', size: 4
                        });
                    }
                }

                if (player.invincible <= 0 && dist(e.x, e.y, player.x, player.y) < e.size + 20) {
                    player.health -= e.isBoss ? 30 : 20;
                    player.invincible = 60;
                    screenShake = e.isBoss ? 15 : 10;
                    playSound('hit');
                    createExplosion(player.x, player.y, '#00ffff', 10);
                    if (!e.isBoss) {
                        e.health = 0;
                    } else {
                        e.health -= 50;
                    }
                }

                if (!e.isBoss && e.y > canvas.height + 100) {
                    enemies.splice(i, 1);
                    continue;
                }
            }

            // Bullet-enemy collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (dist(b.x, b.y, e.x, e.y) < e.size + b.size) {
                        e.health -= b.damage;
                        hit = true;
                        createExplosion(b.x, b.y, e.color, 5);
                        if (e.health <= 0) {
                            playSound('explosion');
                            createExplosion(e.x, e.y, e.color, e.isBoss ? 80 : 30);
                            score += e.score;
                            kills++;
                            screenShake = e.isBoss ? 25 : 5;

                            if (e.isBoss) {
                                document.getElementById('bossHealthBar').style.display = 'none';
                                document.getElementById('bossName').style.display = 'none';
                                currentBoss = null;
                                bgPhase = 0;
                                for (let p = 0; p < 3; p++) {
                                    powerups.push({
                                        x: e.x + random(-40, 40), 
                                        y: e.y + random(-40, 40),
                                        type: Math.floor(Math.random() * 3),
                                        vy: 2, life: 600
                                    });
                                }
                            } else if (Math.random() < 0.15) {
                                powerups.push({
                                    x: e.x, y: e.y,
                                    type: Math.floor(Math.random() * 3),
                                    vy: 2, life: 600
                                });
                            }

                            enemies.splice(j, 1);
                        }
                        break;
                    }
                }
                if (hit && !b.piercing) {
                    bullets.splice(i, 1);
                } else if (hit && b.piercing) {
                    if (b.y < -50 || b.x < -50 || b.x > canvas.width + 50) {
                        bullets.splice(i, 1);
                    }
                }
            }

            // Enemy bullet-player collisions
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                if (player.invincible <= 0 && dist(b.x, b.y, player.x, player.y) < 25) {
                    player.health -= b.damage;
                    player.invincible = 60;
                    screenShake = 8;
                    playSound('hit');
                    createExplosion(player.x, player.y, '#ff4444', 10);
                    enemyBullets.splice(i, 1);
                }
            }

            // Power-ups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.vy;
                p.life--;

                if (dist(p.x, p.y, player.x, player.y) < 30) {
                    playSound('powerup');
                    if (p.type === 0) player.health = Math.min(player.maxHealth, player.health + 30);
                    else if (p.type === 1) player.weapon = Math.min(4, player.weapon + 1);
                    else if (p.type === 2) {
                        player.invincible = 180;
                        createExplosion(player.x, player.y, '#00ff88', 20);
                    }
                    powerups.splice(i, 1);
                    continue;
                }

                if (p.life <= 0 || p.y > canvas.height + 50) {
                    powerups.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Check wave complete
            if (bossSpawned && currentBoss === null && enemies.length === 0 && enemiesToSpawn === 0) {
                if (wave > highestWaveReached) {
                    highestWaveReached = wave;
                }
                wave++;
                startWave();
            }

            // Check game over
            if (player.health <= 0) {
                gameState = 'gameover';
                createExplosion(player.x, player.y, '#00ffff', 50);
                document.getElementById('finalScore').textContent = score.toLocaleString();
                document.getElementById('finalWave').textContent = wave;
                document.getElementById('finalKills').textContent = kills;
                document.getElementById('gameOverScreen').classList.remove('hidden');
                document.getElementById('hud').style.display = 'none';
                document.getElementById('weaponIndicator').style.display = 'none';
                document.getElementById('bossHealthBar').style.display = 'none';
                document.getElementById('bossName').style.display = 'none';
            }

            // Update HUD
            document.getElementById('scoreDisplay').textContent = score.toLocaleString();
            document.getElementById('waveDisplay').textContent = wave;
            document.getElementById('healthFill').style.width = Math.max(0, player.health) + '%';

            updateWeaponUI();
        }

        function drawBackground() {
            const theme = bgPhase === 1 ? bossThemes[currentBossTheme] || bossThemes[5] : null;

            // Base color
            let baseR, baseG, baseB;
            if (bgPhase === 1 && theme) {
                baseR = 3 + (theme.baseColor.r - 3) * bgPhaseTransition;
                baseG = 3 + (theme.baseColor.g - 3) * bgPhaseTransition;
                baseB = 5 + (theme.baseColor.b - 5) * bgPhaseTransition;
            } else {
                baseR = 3;
                baseG = 3;
                baseB = 5;
            }
            ctx.fillStyle = 'rgba(' + Math.floor(baseR) + ',' + Math.floor(baseG) + ',' + Math.floor(baseB) + ', 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Deep space warp rings
            warpRings.forEach(ring => {
                ring.radius += ring.speed;
                if (ring.radius > Math.max(canvas.width, canvas.height) * 0.8) {
                    ring.radius = 20;
                }
                const alpha = ring.alpha * (1 - ring.radius / (Math.max(canvas.width, canvas.height) * 0.8));
                let ringColor = ring.color;
                if (bgPhase === 1 && theme) {
                    // Shift ring colors toward theme
                    ringColor = theme.geoColors[Math.floor(random(0, theme.geoColors.length))].replace(/[\d.]+\)$/, '');
                }
                ctx.strokeStyle = ringColor + (alpha * (1 - bgPhaseTransition * 0.3)) + ')';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(canvas.width/2, canvas.height/2, ring.radius, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Aurora / energy waves
            const auroraColors = bgPhase === 1 && theme ? theme.auroraColors : 
                ['rgba(0, 200, 255, 0.08)', 'rgba(100, 0, 200, 0.08)', 'rgba(0, 255, 150, 0.06)', 'rgba(200, 0, 100, 0.07)', 'rgba(0, 100, 255, 0.07)', 'rgba(255, 100, 0, 0.06)'];

            auroraWaves.forEach((wave, i) => {
                wave.phase += wave.speed * 0.02;
                const color = bgPhase === 1 && theme ? auroraColors[i % auroraColors.length] : wave.color;
                ctx.strokeStyle = color;
                ctx.lineWidth = wave.width;
                ctx.beginPath();
                for (let x = 0; x < canvas.width; x += 3) {
                    const y = wave.y + Math.sin(x * wave.frequency + wave.phase) * wave.amplitude;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                wave.y += 0.2;
                if (wave.y > canvas.height + 100) wave.y = -100;
            });

            // Floating geometric shapes
            const geoColors = bgPhase === 1 && theme ? theme.geoColors : null;
            geoShapes.forEach(shape => {
                shape.x += shape.vx;
                shape.y += shape.vy;
                shape.rotation += shape.rotSpeed;

                if (shape.x < -50) shape.x = canvas.width + 50;
                if (shape.x > canvas.width + 50) shape.x = -50;
                if (shape.y < -50) shape.y = canvas.height + 50;
                if (shape.y > canvas.height + 50) shape.y = -50;

                const pulse = Math.sin(frameCount * 0.03 + shape.pulsePhase) * 0.2 + 0.8;
                const color = geoColors ? geoColors[shape.type % geoColors.length] : shape.color;

                ctx.save();
                ctx.translate(shape.x, shape.y);
                ctx.rotate(shape.rotation);
                ctx.scale(pulse, pulse);
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();

                if (shape.type === 0) {
                    ctx.moveTo(0, -shape.size);
                    ctx.lineTo(-shape.size * 0.866, shape.size * 0.5);
                    ctx.lineTo(shape.size * 0.866, shape.size * 0.5);
                } else if (shape.type === 1) {
                    ctx.rect(-shape.size/2, -shape.size/2, shape.size, shape.size);
                } else {
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i;
                        const px = Math.cos(angle) * shape.size;
                        const py = Math.sin(angle) * shape.size;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            });

            // Nebulae
            const nebulae = bgPhaseTransition > 0.5 ? nebulaeBoss : nebulaeNormal;
            nebulae.forEach(n => {
                n.x += n.drift;
                if (n.x < -n.radius) n.x = canvas.width + n.radius;
                if (n.x > canvas.width + n.radius) n.x = -n.radius;

                const pulse = Math.sin(frameCount * n.pulseSpeed + n.pulseOffset) * 0.15 + 0.85;
                const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius * pulse);
                grad.addColorStop(0, n.color);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.fillRect(n.x - n.radius, n.y - n.radius, n.radius * 2, n.radius * 2);
            });

            // Crossfade other nebulae
            const otherNebulae = bgPhaseTransition > 0.5 ? nebulaeNormal : nebulaeBoss;
            const otherAlpha = bgPhaseTransition > 0.5 ? (1 - bgPhaseTransition) : bgPhaseTransition;

            if (otherAlpha > 0.01) {
                otherNebulae.forEach(n => {
                    n.x += n.drift;
                    if (n.x < -n.radius) n.x = canvas.width + n.radius;
                    if (n.x > canvas.width + n.radius) n.x = -n.radius;

                    const pulse = Math.sin(frameCount * n.pulseSpeed + n.pulseOffset) * 0.15 + 0.85;
                    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius * pulse);
                    const colorMatch = n.color.match(/rgba\((\d+),\s*(\d+),\s*(\d+),\s*([\d.]+)\)/);
                    if (colorMatch) {
                        const newAlpha = parseFloat(colorMatch[4]) * otherAlpha;
                        grad.addColorStop(0, 'rgba(' + colorMatch[1] + ',' + colorMatch[2] + ',' + colorMatch[3] + ',' + newAlpha + ')');
                    } else {
                        grad.addColorStop(0, n.color);
                    }
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.fillRect(n.x - n.radius, n.y - n.radius, n.radius * 2, n.radius * 2);
                });
            }

            // Floating energy orbs
            energyOrbs.forEach(orb => {
                orb.x += orb.vx;
                orb.y += orb.vy;
                if (orb.x < -orb.radius) orb.x = canvas.width + orb.radius;
                if (orb.x > canvas.width + orb.radius) orb.x = -orb.radius;
                if (orb.y < -orb.radius) orb.y = canvas.height + orb.radius;
                if (orb.y > canvas.height + orb.radius) orb.y = -orb.radius;

                const pulse = Math.sin(frameCount * orb.pulseSpeed + orb.pulsePhase) * 0.3 + 0.7;
                const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius * pulse);
                grad.addColorStop(0, orb.color);
                grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius * pulse, 0, Math.PI * 2);
                ctx.fill();
            });

            // Shooting stars
            shootingStars.forEach(s => {
                s.timer--;
                if (!s.active && s.timer <= 0) {
                    s.active = true;
                    s.x = random(-50, canvas.width * 0.6);
                    s.y = random(-50, canvas.height * 0.35);
                    s.vx = random(6, 16);
                    s.vy = random(1, 5);
                    s.life = 0;
                    s.maxLife = random(25, 60);
                }

                if (s.active) {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.life++;

                    const progress = s.life / s.maxLife;
                    const alpha = progress < 0.2 ? progress / 0.2 : (1 - progress) / 0.8;

                    ctx.strokeStyle = 'rgba(255, 255, 220, ' + (alpha * (1 - bgPhaseTransition * 0.4)) + ')';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(s.x - s.vx * 4, s.y - s.vy * 4);
                    ctx.stroke();

                    ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    if (s.life >= s.maxLife || s.x > canvas.width + 100 || s.y > canvas.height + 100) {
                        s.active = false;
                        s.timer = random(100, 400);
                    }
                }
            });

            // Layered stars with orbital motion
            allStars.forEach(s => {
                s.y += s.speed;
                s.orbitAngle += s.orbitSpeed;
                const ox = Math.cos(s.orbitAngle) * s.orbitRadius * 0.3;
                const oy = Math.sin(s.orbitAngle) * s.orbitRadius * 0.3;

                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }

                const twinkle = Math.sin(frameCount * s.twinkleSpeed + s.twinkleOffset) * 0.4 + 0.6;
                let alpha = s.baseAlpha * twinkle;
                let color = s.color;

                if (bgPhase === 1 && theme) {
                    alpha *= (1 - theme.starDim * bgPhaseTransition);
                    if (bgPhaseTransition > 0.5) color = theme.starColor;
                }

                ctx.fillStyle = color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(s.x + ox, s.y + oy, s.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            // Vignette
            let vigAlpha = 0.12 + bgPhaseTransition * 0.3;
            const vigGrad = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, canvas.height * 0.25,
                canvas.width / 2, canvas.height / 2, canvas.height * 0.95
            );
            let vigColor = '0, 0, 15';
            if (bgPhase === 1 && theme) {
                vigColor = theme.vignetteColor;
            }
            vigGrad.addColorStop(0, 'transparent');
            vigGrad.addColorStop(1, 'rgba(' + vigColor + ',' + vigAlpha + ')');
            ctx.fillStyle = vigGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Boss lightning
            if (bgPhase === 1 && theme && bgPhaseTransition > 0.3) {
                const rate = theme.lightningRate;
                if (Math.random() < rate) {
                    ctx.fillStyle = 'rgba(' + theme.lightningColor + ', ' + (random(0.03, 0.1) * bgPhaseTransition) + ')';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }
        }

        function draw() {
            ctx.save();

            if (screenShake > 0) {
                ctx.translate(
                    random(-screenShake, screenShake),
                    random(-screenShake, screenShake)
                );
            }

            drawBackground();

            if (gameState === 'playing' || gameState === 'gameover') {
                player.trail.forEach(t => {
                    ctx.fillStyle = 'rgba(0, 200, 255, ' + (t.life * 0.5) + ')';
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 3 * t.life, 0, Math.PI * 2);
                    ctx.fill();
                });

                if (player.invincible <= 0 || Math.floor(frameCount / 4) % 2 === 0) {
                    ctx.save();
                    ctx.translate(player.x, player.y);

                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 20;

                    ctx.fillStyle = '#00aaff';
                    ctx.beginPath();
                    ctx.moveTo(0, -25);
                    ctx.lineTo(-20, 20);
                    ctx.lineTo(0, 10);
                    ctx.lineTo(20, 20);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.moveTo(0, -10);
                    ctx.lineTo(-5, 5);
                    ctx.lineTo(5, 5);
                    ctx.closePath();
                    ctx.fill();

                    ctx.shadowColor = '#0088ff';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#0088ff';
                    ctx.beginPath();
                    ctx.arc(-8, 20, 4 + Math.random() * 3, 0, Math.PI * 2);
                    ctx.arc(8, 20, 4 + Math.random() * 3, 0, Math.PI * 2);
                    ctx.fill();

                    if (player.invincible > 0) {
                        ctx.strokeStyle = 'rgba(0, 255, 136, ' + (player.invincible / 180) + ')';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(0, 0, 35, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                // Draw bullets with nova appearance for weapon 5
                bullets.forEach(b => {
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = b.isNova ? 18 : 10;
                    ctx.fillStyle = b.color;

                    if (b.isNova) {
                        ctx.beginPath();
                        ctx.moveTo(b.x, b.y - b.size * 1.3);
                        ctx.lineTo(b.x + b.size * 0.9, b.y);
                        ctx.lineTo(b.x, b.y + b.size * 1.3);
                        ctx.lineTo(b.x - b.size * 0.9, b.y);
                        ctx.closePath();
                        ctx.fill();

                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 8;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                enemyBullets.forEach(b => {
                    ctx.shadowColor = b.color;
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                enemies.forEach(e => {
                    ctx.save();
                    ctx.translate(e.x, e.y);

                    ctx.shadowColor = e.color;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = e.color;

                    if (e.isBoss) {
                        const scale = 1 + (wave - 1) * 0.08;
                        ctx.scale(scale, scale);

                        ctx.beginPath();
                        ctx.moveTo(0, 60);
                        ctx.lineTo(-50, 20);
                        ctx.lineTo(-40, -20);
                        ctx.lineTo(-20, -40);
                        ctx.lineTo(0, -30);
                        ctx.lineTo(20, -40);
                        ctx.lineTo(40, -20);
                        ctx.lineTo(50, 20);
                        ctx.closePath();
                        ctx.fill();

                        ctx.shadowColor = '#ff8800';
                        ctx.shadowBlur = 25;
                        ctx.fillStyle = '#ff4400';
                        ctx.beginPath();
                        ctx.arc(0, 0, 15, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.shadowColor = '#ffff00';
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(0, -10, 6, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        if (e.name === 'drone') {
                            ctx.moveTo(0, e.size);
                            ctx.lineTo(-e.size, -e.size/2);
                            ctx.lineTo(e.size, -e.size/2);
                        } else if (e.name === 'fighter') {
                            ctx.moveTo(0, e.size);
                            ctx.lineTo(-e.size, -e.size);
                            ctx.lineTo(0, -e.size/2);
                            ctx.lineTo(e.size, -e.size);
                        } else if (e.name === 'heavy') {
                            ctx.moveTo(0, e.size);
                            ctx.lineTo(-e.size, 0);
                            ctx.lineTo(-e.size/2, -e.size);
                            ctx.lineTo(e.size/2, -e.size);
                            ctx.lineTo(e.size, 0);
                        } else if (e.name === 'speeder') {
                            ctx.moveTo(0, e.size);
                            ctx.lineTo(-e.size/2, 0);
                            ctx.lineTo(0, -e.size);
                            ctx.lineTo(e.size/2, 0);
                        } else if (e.name === 'interceptor') {
                            ctx.moveTo(0, e.size);
                            ctx.lineTo(-e.size, -e.size/3);
                            ctx.lineTo(0, -e.size);
                            ctx.lineTo(e.size, -e.size/3);
                        } else if (e.name === 'bomber') {
                            ctx.moveTo(0, e.size);
                            ctx.lineTo(-e.size, -e.size/2);
                            ctx.lineTo(-e.size/2, -e.size);
                            ctx.lineTo(0, -e.size*0.8);
                            ctx.lineTo(e.size/2, -e.size);
                            ctx.lineTo(e.size, -e.size/2);
                        }
                        ctx.closePath();
                        ctx.fill();
                    }

                    ctx.restore();
                });

                powerups.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.shadowBlur = 15;

                    const colors = ['#00ff88', '#ff00ff', '#ffff00'];
                    const symbols = ['+', 'W', 'S'];
                    ctx.shadowColor = colors[p.type];
                    ctx.fillStyle = colors[p.type];

                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 14px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(symbols[p.type], 0, 1);

                    ctx.restore();
                });

                particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 5;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                });
                            ctx.globalAlpha = 1;
        }

        ctx.restore();
        drawMobileControls();
    }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initAudio();
            gameState = 'playing';
            score = 0;
            wave = 1;
            kills = 0;
            screenShake = 0;
            frameCount = 0;
            highestWaveReached = 1;
            bgPhase = 0;
            bgPhaseTransition = 0;
            currentBossTheme = 0;

            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.health = 100;
            player.weapon = 0;
            player.invincible = 0;
            player.trail = [];
            player.shootTimer = 0;

            bullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];
            powerups = [];

            currentBoss = null;
            bossSpawned = false;

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('weaponIndicator').style.display = 'flex';
            document.getElementById('bossHealthBar').style.display = 'none';
            document.getElementById('bossName').style.display = 'none';

            document.querySelector('#startScreen .title').textContent = 'Neon Void';
            document.querySelector('#startScreen .subtitle').textContent = 'Space Shooter';
            document.getElementById('startBtn').textContent = 'Initialize';

            startWave();
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startBtn').blur();
            if (gameState === 'paused') {
                gameState = 'playing';
                document.getElementById('startScreen').classList.add('hidden');
            } else {
                startGame();
            }
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('restartBtn').blur();
            startGame();
        });

        gameLoop();

        /* ===== CANVAS DRAWN MOBILE CONTROLS ===== */
const activeTouches = new Map(); // touchId -> { buttonId, actionDone }

function getMobileButtons() {
  const cy = canvas.height;
  return [
    { id: 'up',    key: 'arrowup',    x: 110, y: cy - 155, r: 32, label: '▲', rgb: '0,255,255' },
    { id: 'down',  key: 'arrowdown',  x: 110, y: cy - 45,  r: 32, label: '▼', rgb: '0,255,255' },
    { id: 'left',  key: 'arrowleft',  x: 55,  y: cy - 100, r: 32, label: '◀', rgb: '0,255,255' },
    { id: 'right', key: 'arrowright', x: 165, y: cy - 100, r: 32, label: '▶', rgb: '0,255,255' },
    { id: 'shoot', key: ' ',          x: canvas.width - 75, y: cy - 75,  r: 42, label: '●', rgb: '255,0,80' },
    { id: 'weapon',key: null,         x: canvas.width - 75, y: cy - 160, r: 28, label: '↻', rgb: '255,200,0', action: 'weapon' }
  ];
}

function getButtonAt(x, y) {
  for (const b of getMobileButtons()) {
    const dx = x - b.x, dy = y - b.y;
    if (dx * dx + dy * dy <= b.r * b.r) return b;
  }
  return null;
}

function drawMobileControls() {
  if (canvas.width > 900) return;
  const pressedIds = new Set([...activeTouches.values()].map(t => t.buttonId));

  for (const b of getMobileButtons()) {
    const on = pressedIds.has(b.id);
    ctx.save();
    ctx.fillStyle = `rgba(${b.rgb},${on ? 0.45 : 0.18})`;
    ctx.strokeStyle = `rgba(${b.rgb},${on ? 0.95 : 0.5})`;
    ctx.lineWidth = 2;
    ctx.shadowColor = `rgba(${b.rgb},0.6)`;
    ctx.shadowBlur = on ? 22 : 10;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * (on ? 0.9 : 1), 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = on ? '#fff' : `rgba(${b.rgb},0.95)`;
    ctx.font = `bold ${Math.floor(b.r * 0.65)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y + 1);
    ctx.restore();
  }
}

function cycleWeapon() {
  let next = player.weapon, guard = 0;
  do { next = (next + 1) % 5; guard++; }
  while (guard < 5 && highestWaveReached < weaponUnlocks[next]);
  if (highestWaveReached >= weaponUnlocks[next]) {
    player.weapon = next;
    showUnlockNotification('Weapon ' + (next + 1));
    updateWeaponUI();
  }
}

function handleTouch(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;

  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const x = (t.clientX - rect.left) * sx;
    const y = (t.clientY - rect.top) * sy;
    const prev = activeTouches.get(t.identifier);
    const btn = getButtonAt(x, y);

    if (prev && (!btn || btn.id !== prev.buttonId)) {
      const old = getMobileButtons().find(b => b.id === prev.buttonId);
      if (old && old.key) keys[old.key] = false;
    }
    if (btn && (!prev || prev.buttonId !== btn.id)) {
      const rec = { buttonId: btn.id, actionDone: prev ? prev.actionDone : false };
      activeTouches.set(t.identifier, rec);
      if (btn.key) keys[btn.key] = true;
      if (btn.action === 'weapon' && !rec.actionDone) {
        rec.actionDone = true;
        cycleWeapon();
      }
    }
    if (!btn) activeTouches.delete(t.identifier);
  }
}

function handleTouchEnd(e) {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    const prev = activeTouches.get(t.identifier);
    if (prev) {
      const old = getMobileButtons().find(b => b.id === prev.buttonId);
      if (old && old.key) keys[old.key] = false;
      activeTouches.delete(t.identifier);
    }
  }
}

canvas.addEventListener('touchstart', handleTouch, { passive: false });
canvas.addEventListener('touchmove',  handleTouch, { passive: false });
canvas.addEventListener('touchend',   handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel',handleTouchEnd, { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
